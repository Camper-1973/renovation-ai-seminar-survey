<!DOCTYPE html><html lang="ja"><head><base target="_top"><style>
*{box-sizing:border-box}body{margin:0;background:#f0eee8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.stage{width:min(100vw,177.78vh);min-height:min(56.25vw,100vh);margin:auto;padding:2vw 2.7vw}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.8vw}.eyebrow{font-size:1vw;color:#6e6a62}.title{font-size:2.7vw;font-weight:900}.event{font-size:.8vw;background:#dedbd2;border-radius:99px;padding:.35vw .65vw;display:inline-block;margin-top:.45vw}.count{font-size:3.8vw;font-weight:900}.count small{font-size:1vw;color:#777}.commentary{background:#fff7e6;border:1px solid #e7d2a7;border-radius:1vw;padding:.9vw 1.1vw;margin-bottom:.9vw}.commentaryTitle{font-size:1.45vw;font-weight:900;margin-bottom:.2vw}.commentaryText{font-size:.9vw;line-height:1.5;color:#50483d}.typeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.65vw;margin-bottom:1vw}.typeCard{background:#fff;border:1px solid #ddd7cc;border-radius:.9vw;padding:.65vw;text-align:center;min-height:6.2vw}.emoji{font-size:2vw}.pct{font-size:1.35vw;font-weight:900}.name{font-size:.8vw;font-weight:800}.bar{height:.35vw;background:#ece8e0;border-radius:99px;overflow:hidden;margin-top:.35vw}.fill{height:100%;background:#3f654c}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:.9vw}.role{background:#fff;border:1px solid #ddd7cc;border-radius:1vw;padding:1vw;min-height:11.5vw}.roleTitle{font-size:1.15vw;font-weight:900;border-bottom:1px solid #e2ddd3;padding-bottom:.55vw}.n{font-size:.75vw;color:#888;margin-left:.3vw}.rank{display:grid;grid-template-columns:2vw 1fr auto;align-items:center;gap:.5vw;margin:.55vw 0}.rankEmoji{font-size:1.4vw}.rankName{font-size:.9vw;font-weight:700}.rankPct{font-size:1vw;font-weight:900}.empty,.error{background:#fff;border-radius:1vw;padding:7vw;text-align:center;color:#777;font-size:1.3vw}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:.8vw;font-size:.9vw;font-weight:700}.btn{border:1px solid #bbb;background:#fff;border-radius:.5vw;padding:.45vw .8vw;cursor:pointer}.legacy{font-size:.7vw;color:#888;margin-top:.3vw}@media(max-width:800px){.stage{width:100%;padding:15px}.top{display:block}.title{font-size:27px}.eyebrow{font-size:12px}.event{font-size:11px;padding:5px 8px}.count{font-size:38px}.count small{font-size:12px}.commentary{padding:12px 14px;margin:10px 0}.commentaryTitle{font-size:20px}.commentaryText{font-size:13px}.typeGrid{grid-template-columns:1fr 1fr;gap:8px}.typeCard{padding:10px}.emoji{font-size:28px}.pct{font-size:20px}.name{font-size:13px}.bar{height:5px}.roles{grid-template-columns:1fr}.role{padding:13px}.roleTitle{font-size:17px}.n{font-size:12px}.rank{grid-template-columns:30px 1fr auto}.rankEmoji{font-size:22px}.rankName{font-size:14px}.rankPct{font-size:15px}.footer{font-size:13px}.legacy{font-size:10px}}

.ecosystemHero{position:relative;overflow:hidden;border-radius:1.2vw;margin-bottom:.9vw;padding:1.05vw 1.2vw;color:#fff;min-height:7.5vw;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1vw;box-shadow:0 .5vw 1.6vw #2b24151f}.ecosystemHero>*{position:relative;z-index:2}.ecosystemHero::before,.ecosystemHero::after{content:"";position:absolute;inset:-30%;pointer-events:none}.ecoEmoji{font-size:5vw;filter:drop-shadow(0 .4vw .7vw #0005);animation:ecoPop .75s cubic-bezier(.2,.9,.25,1.2) both}.ecoKicker{font-size:.78vw;letter-spacing:.15em;opacity:.85}.ecoTitle{font-size:1.65vw;font-weight:950;line-height:1.2}.ecoText{font-size:.85vw;line-height:1.5;margin-top:.25vw;max-width:54vw}.ecoStat{text-align:right}.ecoStat b{display:block;font-size:2.3vw}.ecoStat span{font-size:.75vw}.ecosystemHero.lion{background:radial-gradient(circle at 25% 20%,#ffd66d,#b54822 42%,#4b1c18)}.ecosystemHero.lion::before{background:repeating-conic-gradient(#ffd76c22 0 7deg,transparent 7deg 16deg);animation:ecoSpin 18s linear infinite}.ecosystemHero.boar{background:linear-gradient(135deg,#4b2d1d,#a8572b,#d79342)}.ecosystemHero.boar::before{background:repeating-linear-gradient(115deg,transparent 0 24px,#fff2 25px 29px);animation:ecoSpeed 1.2s linear infinite}.ecosystemHero.rabbit{background:linear-gradient(145deg,#5f8d69,#a6c99a,#d8e4b9);color:#183b28}.ecosystemHero.rabbit::after{background:radial-gradient(circle at 15% 25%,#fff8 0 5px,transparent 6px),radial-gradient(circle at 72% 20%,#fff8 0 7px,transparent 8px),radial-gradient(circle at 85% 75%,#fff7 0 5px,transparent 6px);animation:ecoFloat 5s ease-in-out infinite}.ecosystemHero.owl{background:radial-gradient(circle at 25% 25%,#315c77,#14293a 60%,#08131d)}.ecosystemHero.owl::before{background-image:linear-gradient(#9fdfff20 1px,transparent 1px),linear-gradient(90deg,#9fdfff20 1px,transparent 1px);background-size:30px 30px;transform:perspective(400px) rotateX(55deg);animation:ecoGrid 5s linear infinite}.ecosystemHero.fox{background:linear-gradient(135deg,#633023,#c76832,#e1a24e)}.ecosystemHero.cat{background:linear-gradient(135deg,#30273a,#715a79,#b08ba9)}.ecosystemHero.wolf{background:linear-gradient(145deg,#182733,#465e6b,#83949a)}.ecosystemHero.gorilla{background:linear-gradient(135deg,#21372c,#47705a,#7e9473)}.ecosystemHero.whale{background:linear-gradient(#143b52,#28728f,#79afba)}.ecosystemHero.tanuki{background:linear-gradient(135deg,#443526,#7b694c,#aa9876)}
.typeCard.leader{transform:translateY(-.2vw);border:2px solid #d18c3d;box-shadow:0 .45vw 1.2vw #5d3c1622}.typeCard.leader .emoji{font-size:2.7vw}.crown{display:block;font-size:.65vw;color:#a66422;font-weight:900;letter-spacing:.08em;margin-bottom:.15vw}
@keyframes ecoPop{from{opacity:0;transform:scale(.25) rotate(-8deg)}70%{transform:scale(1.15)}to{opacity:1;transform:scale(1)}}@keyframes ecoSpin{to{transform:rotate(360deg)}}@keyframes ecoSpeed{to{transform:translate(50px,-20px)}}@keyframes ecoFloat{50%{transform:translateY(-10px)}}@keyframes ecoGrid{to{background-position:0 30px,30px 0}}
@media(max-width:800px){.ecosystemHero{border-radius:14px;padding:14px;grid-template-columns:70px 1fr}.ecoEmoji{font-size:54px}.ecoKicker{font-size:10px}.ecoTitle{font-size:22px}.ecoText{font-size:12px;max-width:none}.ecoStat{grid-column:1/3;text-align:left;display:flex;gap:7px;align-items:baseline}.ecoStat b{font-size:24px}.ecoStat span{font-size:11px}.typeCard.leader .emoji{font-size:34px}.crown{font-size:10px}}
@media(prefers-reduced-motion:reduce){.ecosystemHero::before,.ecosystemHero::after,.ecoEmoji{animation:none!important}}

</style></head><body><div class="stage"><div class="top"><div><div class="eyebrow">リノベ業界 生態系診断</div><div class="title" id="title">東北エリアの生態系</div><div class="event" id="eventLabel">リノベーション協議会 東北部会｜東北エリア</div></div><div><div class="count"><span id="total">0</span><small> 回答</small></div><div class="legacy" id="legacy"></div></div></div><div id="commentary"></div><div id="content"><div class="empty">生態系を読み込んでいます…</div></div><div class="footer"><div>相性のいい動物を見つけて、結果カードを見せ合ってみましょう。</div><button class="btn" onclick="loadDashboard()">最新表示</button></div></div>
<script>
const EVENT_ID='<?= eventId ?>';
const DASH_SCENES={
  lion:{scene:'lion',tag:'🔥 決断と推進が強い群れ',line:'前へ進める人が多い。話が具体化するのが速そうです。'},
  boar:{scene:'boar',tag:'💨 まず試す人が多い群れ',line:'考えて終わらず、やってみる。挑戦が始まりやすい会場です。'},
  rabbit:{scene:'rabbit',tag:'🌿 安心して話せる群れ',line:'人の話を拾う力が強い。初対面でもつながりが生まれやすそうです。'},
  owl:{scene:'owl',tag:'📐 かなり考える群れ',line:'根拠・検証・再現性を大切にする人が多い。議論が深くなりそうです。'},
  fox:{scene:'fox',tag:'🧩 コラボが生まれやすい群れ',line:'人・情報・アイデアを組み合わせる人が多い。企画が化けそうです。'},
  cat:{scene:'cat',tag:'✨ 世界観の濃い群れ',line:'美意識や独自性を大事にする人が多い。空間づくりの話が熱くなりそうです。'},
  wolf:{scene:'wolf',tag:'🌙 専門性を深掘る群れ',line:'一つのテーマを深く掘る人が多い。濃い情報交換になりそうです。'},
  gorilla:{scene:'gorilla',tag:'💪 巻き込み力の強い群れ',line:'人をつなぎながら実行する人が多い。交流会から案件が動きそうです。'},
  whale:{scene:'whale',tag:'🌊 大きな構想を描く群れ',line:'長い時間軸で業界や地域を見る人が多い。話が大きく広がりそうです。'},
  tanuki:{scene:'tanuki',tag:'🍂 調整と接続が上手い群れ',line:'立場の違う人を自然につなぐ人が多い。場そのものが機能しそうです。'}
};
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function countOf(d,keys){return keys.reduce((s,k)=>s+(d.typeCounts[k]||0),0)}
function typeLabel(d,key){return d.types&&d.types[key]?d.types[key].name:key}
function ecosystemComment(d){
  if(!d.diagnosedTotal)return{title:'東北エリアの生態系、ただいま観察中。',text:'回答が集まると、ここに会場全体の特徴を少し持ち上げ気味に解説します。さて、どんな生態系になるでしょうか。'};
  if(d.diagnosedTotal<4)return{title:'まだ少数精鋭。すでに面白い気配があります。',text:'回答が4件以上集まると、東北エリアの「推進力」「思考力」「共感力」「企画力」から、会場全体の傾向を解説します。'};
  const groups=[
    {key:'attack',label:'推進力・突破力',value:countOf(d,['lion','gorilla','boar']),title:'東北エリア、かなり前へ進める生態系です。',text:'ライオン・ゴリラ・イノシシ系が多めです。考えるだけで終わらず、現場や案件を実際に前へ動かす力が強い構成です。これはすごいですね。地域で新しい取り組みを始める時、かなり頼もしい布陣になっているんじゃないでしょうか。'},
    {key:'think',label:'思考力・検証力',value:countOf(d,['owl','wolf','whale']),title:'東北エリア、かなり深く考える生態系です。',text:'フクロウ・オオカミ・クジラ系が多めです。勢いや雰囲気だけではなく、根拠・専門性・長期視点を大事にする人が集まっています。これは強いですね。単発の盛り上がりではなく、続く仕組みを考えられる状況になっているんじゃないでしょうか。'},
    {key:'gentle',label:'共感力・調整力',value:countOf(d,['rabbit','tanuki']),title:'東北エリア、安心して話せる生態系です。',text:'ウサギ・タヌキ系が多めです。相手の話を聞く、場を整える、違う立場をつなぐ力が目立ちます。これは素敵ですね。交流会でも、初対面同士が自然に話しやすい空気になっているんじゃないでしょうか。'},
    {key:'creative',label:'企画力・表現力',value:countOf(d,['fox','cat']),title:'東北エリア、発想が豊かな生態系です。',text:'キツネ・ネコ系が多めです。人・素材・情報を組み合わせたり、独自の世界観を形にしたりする力がありそうです。これは面白いですね。普通の勉強会で終わらず、新しい企画やコラボが生まれやすい状況なんじゃないでしょうか。'}
  ].sort((a,b)=>b.value-a.value);
  const top=groups[0],second=groups[1],pct=Math.round(top.value/d.diagnosedTotal*100);
  let title=top.title;
  let text='まず全体として、'+top.label+'のタイプが'+pct+'%と目立っています。'+top.text;
  if(top.value===second.value){title='東北エリア、バランスのいい生態系です。';text='まず全体として、一つのタイプに偏りすぎず、いくつかの強みが拮抗しています。これはかなりいいですね。推進する人、考える人、整える人、企画する人が混ざっていて、部会としての総合力が出やすい状況なんじゃないでしょうか。'}
  const ranked=Object.keys(d.typeCounts).map(k=>({key:k,value:d.typeCounts[k]||0})).sort((a,b)=>b.value-a.value);
  const first=ranked[0];
  if(first&&first.value>0){text+=' 特に多い動物タイプは「'+typeLabel(d,first.key)+'」です。';}
  if(first&&first.value/d.diagnosedTotal>=.25){const extra={lion:'決断役が自然に生まれやすく、話が前に進みやすい会場です。',owl:'根拠や再現性を大切にする人が多く、議論の質が上がりやすい会場です。',rabbit:'初対面でも安心して話しやすく、交流の入口がやわらかい会場です。',boar:'まず試してみる空気があり、新しい挑戦が始まりやすい会場です。',gorilla:'人を巻き込む力があり、交流会から具体的なつながりが生まれやすい会場です。',fox:'アイデアを組み合わせる力があり、コラボの芽が見つかりやすい会場です。',cat:'美意識や世界観への感度が高く、空間づくりの話が深まりやすい会場です。',wolf:'専門性を深掘りする人が多く、濃い情報交換になりやすい会場です。',whale:'長期視点で地域や業界を見ている人が多く、大きな話に広がりやすい会場です。',tanuki:'場を読み、つなぐ人が多く、違う立場同士が話しやすい会場です。'};if(extra[first.key])text+=' '+extra[first.key]}
  return{title,text};
}
function loadDashboard(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>document.getElementById('content').innerHTML='<div class="error">読み込めませんでした。'+esc(e&&e.message?e.message:'')+'</div>').getDashboardData(EVENT_ID)}
function render(d){
  document.getElementById('total').textContent=d.total||0;
  document.getElementById('title').textContent=EVENT_ID.indexOf('sendai-')===0?'東北エリアの生態系':'会場の生態系';
  document.getElementById('eventLabel').textContent=EVENT_ID.indexOf('sendai-')===0?'リノベーション協議会 東北部会｜東北エリア｜2026-10-08':'全イベント';
  document.getElementById('legacy').textContent=d.legacyTotal?'旧バージョン回答 '+d.legacyTotal+'件は動物分布から除外':'';
  const c=ecosystemComment(d);document.getElementById('commentary').innerHTML='<div class="commentary"><div class="commentaryTitle">'+esc(c.title)+'</div><div class="commentaryText">'+esc(c.text)+'</div></div>';
  if(!d.diagnosedTotal){document.getElementById('content').innerHTML='<div class="empty">v0.5.0の回答を待っています。</div>';return}
  const all=Object.keys(d.types).map(k=>{const count=d.typeCounts[k]||0;return{key:k,value:count,percent:Math.round(count/d.diagnosedTotal*100),label:d.types[k].name,emoji:d.types[k].emoji}}).sort((a,b)=>b.value-a.value);
  const leader=all[0],scene=DASH_SCENES[leader.key]||{scene:'owl',tag:'今日の生態系',line:'いろいろな強みが混ざっています。'};
  const hero='<div class="ecosystemHero '+scene.scene+'"><div class="ecoEmoji">'+esc(leader.emoji)+'</div><div><div class="ecoKicker">TODAY’S TOHOKU ECOSYSTEM</div><div class="ecoTitle">'+esc(scene.tag)+'</div><div class="ecoText">'+esc(scene.line)+' 最多は「'+esc(leader.label)+'」タイプ。</div></div><div class="ecoStat"><b>'+leader.percent+'%</b><span>'+leader.value+'人 / '+d.diagnosedTotal+'人</span></div></div>';
  document.getElementById('content').innerHTML=hero+'<div class="typeGrid">'+all.map((x,i)=>typeCard(x,i===0)).join('')+'</div><div class="roles">'+['reno','maker','sales'].map(k=>roleCard(d.roleBreakdown[k])).join('')+'</div>';
}
function typeCard(x,isLeader){return '<div class="typeCard'+(isLeader?' leader':'')+'">'+(isLeader?'<span class="crown">👑 最多タイプ</span>':'')+'<div class="emoji">'+esc(x.emoji)+'</div><div class="pct">'+x.percent+'%</div><div class="name">'+esc(x.label)+' <small>'+x.value+'人</small></div><div class="bar"><div class="fill" style="width:'+x.percent+'%"></div></div></div>'}
function roleCard(b){const ranks=b&&b.typeRanking||[];return '<div class="role"><div class="roleTitle">'+esc(b.label)+'<span class="n">'+b.count+'人</span></div>'+(ranks.length?ranks.slice(0,5).map(x=>'<div class="rank"><div class="rankEmoji">'+esc(x.emoji)+'</div><div class="rankName">'+esc(x.label)+'</div><div class="rankPct">'+x.percent+'%</div></div>').join(''):'<div class="rankName">回答待ち</div>')+'</div>'}
loadDashboard();
</script></body></html>
