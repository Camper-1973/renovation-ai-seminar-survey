<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f3f0; color: #202020; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif; }
    .stage { width: min(100vw, 177.78vh); min-height: min(56.25vw, 100vh); margin: auto; padding: 2.3vw 2.7vw; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.4vw; gap: 1vw; }
    .eyebrow { font-size: 1vw; color: #777; }
    .title { font-size: 2.5vw; font-weight: 850; margin-top: .25vw; }
    .count { font-size: 3.5vw; font-weight: 850; text-align: right; }
    .count small { font-size: 1vw; color: #777; font-weight: 500; }
    .typeGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: .7vw; margin-bottom: 1vw; }
    .typeCard { background: white; border: 1px solid #ddd; border-radius: 1vw; padding: .85vw; min-height: 8vw; text-align: center; }
    .emoji { font-size: 2.1vw; }
    .pct { font-size: 1.65vw; font-weight: 850; margin-top: .2vw; }
    .typeName { font-size: .82vw; font-weight: 750; line-height: 1.25; margin-top: .2vw; }
    .bar { height: .4vw; background: #eee; border-radius: 99px; overflow: hidden; margin-top: .55vw; }
    .fill { height: 100%; background: #222; border-radius: 99px; }
    .roleGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1vw; margin-bottom: 1vw; }
    .roleCard { background: white; border: 1px solid #ddd; border-radius: 1vw; padding: 1.05vw; min-height: 18vw; }
    .roleTitle { font-size: 1.2vw; font-weight: 850; padding-bottom: .7vw; border-bottom: 1px solid #ddd; }
    .n { font-size: .75vw; color: #888; margin-left: .35vw; font-weight: 500; }
    .section { margin-top: .75vw; }
    .sectionTitle { font-size: .78vw; color: #777; font-weight: 800; margin-bottom: .4vw; }
    .rank { display: grid; grid-template-columns: 1.4vw 1fr auto; gap: .45vw; align-items: center; margin: .34vw 0; }
    .num { width: 1.35vw; height: 1.35vw; border-radius: 50%; background: #222; color: white; display: flex; align-items: center; justify-content: center; font-size: .72vw; font-weight: 800; }
    .label { font-size: .84vw; line-height: 1.25; font-weight: 650; }
    .value { font-size: .95vw; font-weight: 850; }
    .connect { background: #222; color: #fff; border-radius: 1vw; padding: 1vw 1.3vw; display: flex; align-items: center; justify-content: space-between; gap: 1.5vw; }
    .connect strong { font-size: 1.12vw; white-space: nowrap; }
    .chips { display: flex; gap: .55vw; flex-wrap: wrap; justify-content: flex-end; }
    .chip { background: #fff; color: #222; border-radius: 99px; padding: .42vw .7vw; font-size: .82vw; font-weight: 750; }
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: .85vw; gap: .7vw; }
    .message { font-size: 1vw; font-weight: 800; }
    .btns { display: flex; gap: .45vw; }
    .btn { border: 1px solid #bbb; background: #fff; border-radius: .55vw; padding: .45vw .7vw; font-size: .75vw; color: #222; text-decoration: none; cursor: pointer; }
    .empty { text-align: center; padding: 8vw 2vw; color: #777; font-size: 1.45vw; }
    .error { background: white; border: 1px solid #ddd; border-radius: 1vw; padding: 3vw; color: #900; font-size: 1.1vw; }
    @media (max-width: 800px) { .stage { width: 100%; padding: 16px; } .top { display: block; } .title { font-size: 28px; } .eyebrow { font-size: 12px; } .count { font-size: 38px; text-align: left; margin-top: 8px; } .count small { font-size: 12px; } .typeGrid, .roleGrid { grid-template-columns: 1fr; gap: 10px; } .typeCard, .roleCard { padding: 15px; min-height: 0; } .emoji { font-size: 30px; } .pct { font-size: 24px; } .typeName, .label { font-size: 14px; } .bar { height: 6px; } .roleTitle { font-size: 18px; } .n, .sectionTitle { font-size: 12px; } .rank { grid-template-columns: 24px 1fr auto; gap: 8px; margin: 8px 0; } .num { width: 22px; height: 22px; font-size: 12px; } .value { font-size: 15px; } .connect { padding: 13px; display: block; } .connect strong { font-size: 15px; } .chips { justify-content: flex-start; margin-top: 9px; } .chip { font-size: 12px; padding: 6px 9px; } .footer { display: block; } .message { font-size: 14px; margin-bottom: 10px; } .btn { font-size: 12px; padding: 7px 9px; } }
  </style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div>
      <div class="eyebrow">1分診断で見えた、今日この会場のリアル</div>
      <div class="title">リノベ業界｜タイプと本音が見えちゃいました。</div>
    </div>
    <div class="count"><span id="total">0</span><small> 回答</small></div>
  </div>
  <div id="content"><div class="empty">集計を読み込んでいます…</div></div>
  <div class="footer">
    <div class="message">この本音が見えたところで、この後の交流会でぜひ話しかけてみましょう。</div>
    <div class="btns"><button class="btn" onclick="loadDashboard()">最新表示</button></div>
  </div>
</div>

<script>
function loadDashboard() {
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(error => {
      document.getElementById('content').innerHTML = '<div class="error">集計を読み込めませんでした。' + esc(error && error.message ? error.message : '') + '</div>';
    })
    .getDashboardData();
}

function render(data) {
  document.getElementById('total').textContent = data.total || 0;
  if (!data.total) {
    document.getElementById('content').innerHTML = '<div class="empty">まだ回答がありません。参加者の回答後に「最新表示」を押してください。</div>';
    return;
  }

  const typeHtml = (data.typeRanking || []).map(item => typeCard(item)).join('');
  const roleHtml = ['reno', 'maker', 'sales'].map(key => roleCard(key, data.roleBreakdown[key])).join('');
  const purposeChips = (data.purposeRanking || []).slice(0, 4).map(item => '<span class="chip">' + esc(shorten(item.label, 18)) + ' ' + item.percent + '%</span>').join('');

  document.getElementById('content').innerHTML =
    '<div class="typeGrid">' + typeHtml + '</div>' +
    '<div class="roleGrid">' + roleHtml + '</div>' +
    '<div class="connect"><strong>今日ここに来た理由 TOP</strong><div class="chips">' + purposeChips + '</div></div>';
}

function typeCard(item) {
  return '<div class="typeCard"><div class="emoji">' + esc(item.emoji) + '</div><div class="pct">' + item.percent + '%</div><div class="typeName">' + esc(item.label) + '</div><div class="bar"><div class="fill" style="width:' + item.percent + '%"></div></div></div>';
}

function roleCard(key, bucket) {
  if (!bucket) return '';
  return '<div class="roleCard"><div class="roleTitle">' + esc(bucket.label) + '<span class="n">' + bucket.count + '人</span></div>' +
    '<div class="section"><div class="sectionTitle">参加理由 TOP3</div>' + ranking(bucket.purposeRanking) + '</div>' +
    '<div class="section"><div class="sectionTitle">タイプ TOP3</div>' + ranking(bucket.typeRanking) + '</div>' +
    '<div class="section"><div class="sectionTitle">伸ばしたいこと TOP3</div>' + ranking(bucket.growthRanking) + '</div></div>';
}

function ranking(items) {
  if (!items || !items.length) return '<div class="label">回答待ち</div>';
  return items.map((item, index) => '<div class="rank"><div class="num">' + (index + 1) + '</div><div class="label">' + esc(shorten(item.label, 18)) + '</div><div class="value">' + item.percent + '%</div></div>').join('');
}

function shorten(text, max) {
  text = String(text || '');
  return text.length > max ? text.slice(0, max - 1) + '…' : text;
}

function esc(value) {
  return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

loadDashboard();
</script>
</body>
</html>
