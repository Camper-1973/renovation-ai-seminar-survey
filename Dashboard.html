<!DOCTYPE html><html lang="ja"><head><base target="_top"><style>
*{box-sizing:border-box}body{margin:0;background:#f0eee8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.stage{width:min(100vw,177.78vh);min-height:min(56.25vw,100vh);margin:auto;padding:2.2vw 2.7vw}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.3vw}.eyebrow{font-size:1vw;color:#6e6a62}.title{font-size:2.7vw;font-weight:900}.event{font-size:.8vw;background:#dedbd2;border-radius:99px;padding:.35vw .65vw;display:inline-block;margin-top:.45vw}.count{font-size:3.8vw;font-weight:900}.count small{font-size:1vw;color:#777}.typeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.65vw;margin-bottom:1vw}.typeCard{background:#fff;border:1px solid #ddd7cc;border-radius:.9vw;padding:.65vw;text-align:center;min-height:6.5vw}.emoji{font-size:2vw}.pct{font-size:1.35vw;font-weight:900}.name{font-size:.8vw;font-weight:800}.bar{height:.35vw;background:#ece8e0;border-radius:99px;overflow:hidden;margin-top:.35vw}.fill{height:100%;background:#3f654c}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:.9vw}.role{background:#fff;border:1px solid #ddd7cc;border-radius:1vw;padding:1vw;min-height:13vw}.roleTitle{font-size:1.15vw;font-weight:900;border-bottom:1px solid #e2ddd3;padding-bottom:.55vw}.n{font-size:.75vw;color:#888;margin-left:.3vw}.rank{display:grid;grid-template-columns:2vw 1fr auto;align-items:center;gap:.5vw;margin:.55vw 0}.rankEmoji{font-size:1.4vw}.rankName{font-size:.9vw;font-weight:700}.rankPct{font-size:1vw;font-weight:900}.empty,.error{background:#fff;border-radius:1vw;padding:7vw;text-align:center;color:#777;font-size:1.3vw}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:.8vw;font-size:.9vw;font-weight:700}.btn{border:1px solid #bbb;background:#fff;border-radius:.5vw;padding:.45vw .8vw;cursor:pointer}.legacy{font-size:.7vw;color:#888;margin-top:.3vw}@media(max-width:800px){.stage{width:100%;padding:15px}.top{display:block}.title{font-size:27px}.eyebrow{font-size:12px}.event{font-size:11px;padding:5px 8px}.count{font-size:38px}.count small{font-size:12px}.typeGrid{grid-template-columns:1fr 1fr;gap:8px}.typeCard{padding:10px}.emoji{font-size:28px}.pct{font-size:20px}.name{font-size:13px}.bar{height:5px}.roles{grid-template-columns:1fr}.role{padding:13px}.roleTitle{font-size:17px}.n{font-size:12px}.rank{grid-template-columns:30px 1fr auto}.rankEmoji{font-size:22px}.rankName{font-size:14px}.rankPct{font-size:15px}.footer{font-size:13px}.legacy{font-size:10px}}
</style></head><body><div class="stage"><div class="top"><div><div class="eyebrow">リノベ業界 生態系診断</div><div class="title" id="title">会場の生態系</div><div class="event" id="eventLabel"><?= eventInfo&&eventInfo.label?eventInfo.label:'全イベント' ?></div></div><div><div class="count"><span id="total">0</span><small> 回答</small></div><div class="legacy" id="legacy"></div></div></div><div id="content"><div class="empty">生態系を読み込んでいます…</div></div><div class="footer"><div>相性のいい動物を見つけて、結果カードを見せ合ってみましょう。</div><button class="btn" onclick="loadDashboard()">最新表示</button></div></div>
<script>
const EVENT_ID='<?= eventId ?>';
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function loadDashboard(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>document.getElementById('content').innerHTML='<div class="error">読み込めませんでした。'+esc(e&&e.message?e.message:'')+'</div>').getDashboardData(EVENT_ID)}
function render(d){document.getElementById('total').textContent=d.total||0;const loc=d.event&&d.event.location?d.event.location+'会場':'全イベント';document.getElementById('title').textContent=loc+'の生態系';if(d.event&&d.event.label)document.getElementById('eventLabel').textContent=d.event.label;document.getElementById('legacy').textContent=d.legacyTotal?'旧バージョン回答 '+d.legacyTotal+'件は動物分布から除外':'';if(!d.diagnosedTotal){document.getElementById('content').innerHTML='<div class="empty">v0.5.0の回答を待っています。</div>';return}const all=Object.keys(d.types).map(k=>{const count=d.typeCounts[k]||0;return{key:k,value:count,percent:Math.round(count/d.diagnosedTotal*100),label:d.types[k].name,emoji:d.types[k].emoji}}).sort((a,b)=>b.value-a.value);document.getElementById('content').innerHTML='<div class="typeGrid">'+all.map(typeCard).join('')+'</div><div class="roles">'+['reno','maker','sales'].map(k=>roleCard(d.roleBreakdown[k])).join('')+'</div>'}
function typeCard(x){return '<div class="typeCard"><div class="emoji">'+esc(x.emoji)+'</div><div class="pct">'+x.percent+'%</div><div class="name">'+esc(x.label)+' <small>'+x.value+'人</small></div><div class="bar"><div class="fill" style="width:'+x.percent+'%"></div></div></div>'}
function roleCard(b){const ranks=b&&b.typeRanking||[];return '<div class="role"><div class="roleTitle">'+esc(b.label)+'<span class="n">'+b.count+'人</span></div>'+(ranks.length?ranks.slice(0,5).map(x=>'<div class="rank"><div class="rankEmoji">'+esc(x.emoji)+'</div><div class="rankName">'+esc(x.label)+'</div><div class="rankPct">'+x.percent+'%</div></div>').join(''):'<div class="rankName">回答待ち</div>')+'</div>'}
loadDashboard();
</script></body></html>
