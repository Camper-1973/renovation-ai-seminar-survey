<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f0eee8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
    .stage{width:min(100vw,177.78vh);min-height:min(56.25vw,100vh);margin:auto;padding:1.6vw 2.4vw}
    .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.65vw}
    .eyebrow{font-size:.9vw;color:#6e6a62}.title{font-size:2.45vw;font-weight:900}.event{font-size:.72vw;background:#dedbd2;border-radius:99px;padding:.3vw .6vw;display:inline-block;margin-top:.35vw}
    .count{font-size:3.4vw;font-weight:900}.count small{font-size:.9vw;color:#777}.legacy{font-size:.65vw;color:#888;margin-top:.2vw}
    .commentary{background:#fff7e6;border:1px solid #e7d2a7;border-radius:.9vw;padding:.75vw 1vw;margin-bottom:.7vw}
    .commentaryTitle{font-size:1.25vw;font-weight:900;margin-bottom:.15vw}.commentaryText{font-size:.8vw;line-height:1.45;color:#50483d}
    .ecosystemHero{position:relative;overflow:hidden;border-radius:1vw;margin-bottom:.7vw;padding:.8vw 1vw;color:#fff;min-height:6.5vw;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.85vw;box-shadow:0 .4vw 1.3vw #2b24151f}
    .ecosystemHero>*{position:relative;z-index:2}.ecosystemHero::before,.ecosystemHero::after{content:"";position:absolute;inset:-30%;pointer-events:none}
    .ecoEmoji{font-size:4.2vw;filter:drop-shadow(0 .35vw .6vw #0005)}.ecoKicker{font-size:.65vw;letter-spacing:.14em;opacity:.85}.ecoTitle{font-size:1.45vw;font-weight:950;line-height:1.15}.ecoText{font-size:.75vw;line-height:1.4;margin-top:.2vw;max-width:54vw}.ecoStat{text-align:right}.ecoStat b{display:block;font-size:2vw}.ecoStat span{font-size:.7vw}
    .ecosystemHero.lion{background:radial-gradient(circle at 25% 20%,#ffd66d,#b54822 42%,#4b1c18)}
    .ecosystemHero.boar{background:linear-gradient(135deg,#4b2d1d,#a8572b,#d79342)}
    .ecosystemHero.rabbit{background:linear-gradient(145deg,#5f8d69,#a6c99a,#d8e4b9);color:#183b28}
    .ecosystemHero.owl{background:radial-gradient(circle at 25% 25%,#315c77,#14293a 60%,#08131d)}
    .ecosystemHero.fox{background:linear-gradient(135deg,#633023,#c76832,#e1a24e)}
    .ecosystemHero.cat{background:linear-gradient(135deg,#30273a,#715a79,#b08ba9)}
    .ecosystemHero.wolf{background:linear-gradient(145deg,#182733,#465e6b,#83949a)}
    .ecosystemHero.gorilla{background:linear-gradient(135deg,#21372c,#47705a,#7e9473)}
    .ecosystemHero.whale{background:linear-gradient(#143b52,#28728f,#79afba)}
    .ecosystemHero.tanuki{background:linear-gradient(135deg,#443526,#7b694c,#aa9876)}
    .sectionTitle{font-size:.78vw;font-weight:900;color:#5a554e;margin:.2vw 0 .4vw;letter-spacing:.04em}
    .groupGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.55vw;margin-bottom:.7vw}
    .groupCard{background:#fff;border:1px solid #ddd7cc;border-radius:.8vw;padding:.55vw .65vw;min-height:4.6vw}
    .groupTop{display:flex;justify-content:space-between;align-items:baseline;gap:.4vw}.groupName{font-size:.86vw;font-weight:900}.groupPct{font-size:1.35vw;font-weight:950}.groupDesc{font-size:.68vw;color:#6f685f;margin-top:.12vw}.groupAnimals{font-size:.67vw;color:#45413d;margin-top:.28vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.groupBar{height:.28vw;background:#ece8e0;border-radius:99px;overflow:hidden;margin-top:.32vw}.groupFill{height:100%;background:#7d8f78}
    .typeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.5vw;margin-bottom:.7vw}
    .typeCard{background:#fff;border:1px solid #ddd7cc;border-radius:.8vw;padding:.5vw;text-align:center;min-height:6.4vw}.typeCard.leader{border:2px solid #d18c3d;box-shadow:0 .35vw 1vw #5d3c1622}.crown{display:block;font-size:.58vw;color:#a66422;font-weight:900;letter-spacing:.06em}.emoji{font-size:1.8vw}.pct{font-size:1.2vw;font-weight:900}.name{font-size:.74vw;font-weight:900}.typeTag{font-size:.64vw;font-weight:800;color:#5e5a54;margin-top:.15vw}.typeOne{font-size:.62vw;color:#77706a;line-height:1.25;margin-top:.12vw}.bar{height:.28vw;background:#ece8e0;border-radius:99px;overflow:hidden;margin-top:.28vw}.fill{height:100%;background:#3f654c}
    .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:.65vw}.role{background:#fff;border:1px solid #ddd7cc;border-radius:.8vw;padding:.65vw;min-height:8.6vw}.roleTitle{font-size:.92vw;font-weight:900;border-bottom:1px solid #e2ddd3;padding-bottom:.35vw}.n{font-size:.68vw;color:#888;margin-left:.25vw}.rank{display:grid;grid-template-columns:1.6vw 1fr auto;align-items:center;gap:.35vw;margin:.34vw 0}.rankEmoji{font-size:1.15vw}.rankName{font-size:.75vw;font-weight:700}.rankPct{font-size:.8vw;font-weight:900}
    .empty,.error{background:#fff;border-radius:1vw;padding:6vw;text-align:center;color:#777;font-size:1.2vw}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:.55vw;font-size:.76vw;font-weight:700}.btn{border:1px solid #bbb;background:#fff;border-radius:.45vw;padding:.35vw .7vw;cursor:pointer}
    @media(max-width:800px){.stage{width:100%;padding:15px}.top{display:block}.title{font-size:27px}.eyebrow{font-size:12px}.event{font-size:11px;padding:5px 8px}.count{font-size:38px}.count small{font-size:12px}.commentary{padding:12px 14px;margin:10px 0}.commentaryTitle{font-size:20px}.commentaryText{font-size:13px}.ecosystemHero{border-radius:14px;padding:14px;grid-template-columns:70px 1fr}.ecoEmoji{font-size:54px}.ecoKicker{font-size:10px}.ecoTitle{font-size:22px}.ecoText{font-size:12px;max-width:none}.ecoStat{grid-column:1/3;text-align:left;display:flex;gap:7px;align-items:baseline}.ecoStat b{font-size:24px}.ecoStat span{font-size:11px}.sectionTitle{font-size:13px}.groupGrid{grid-template-columns:1fr 1fr;gap:8px}.groupCard{padding:10px}.groupName{font-size:14px}.groupPct{font-size:20px}.groupDesc,.groupAnimals{font-size:11px}.groupBar{height:5px}.typeGrid{grid-template-columns:1fr 1fr;gap:8px}.typeCard{padding:10px}.emoji{font-size:28px}.pct{font-size:20px}.name{font-size:13px}.typeTag{font-size:12px}.typeOne{font-size:11px}.bar{height:5px}.roles{grid-template-columns:1fr}.role{padding:13px}.roleTitle{font-size:17px}.n{font-size:12px}.rank{grid-template-columns:30px 1fr auto}.rankEmoji{font-size:22px}.rankName{font-size:14px}.rankPct{font-size:15px}.footer{font-size:13px}.legacy{font-size:10px}}
  </style>
</head>
<body>
<div class="stage">
  <div class="top"><div><div class="eyebrow">リノベ業界 生態系診断</div><div class="title" id="title">東北エリアの生態系</div><div class="event" id="eventLabel">リノベーション協議会 東北部会｜東北エリア</div></div><div><div class="count"><span id="total">0</span><small> 回答</small></div><div class="legacy" id="legacy"></div></div></div>
  <div id="commentary"></div>
  <div id="content"><div class="empty">生態系を読み込んでいます…</div></div>
  <div class="footer"><div>4つの傾向と動物タイプを見ながら、会場全体の強みを読み解きます。</div><button class="btn" onclick="loadDashboard()">最新表示</button></div>
</div>
<script>
const EVENT_ID='<?= eventId ?>';
const GROUPS=[
  {key:'push',name:'推進型',desc:'決める・動かす・前へ進める',animals:['lion','gorilla','boar'],label:'推進力・突破力'},
  {key:'think',name:'分析型',desc:'考える・検証する・深く掘る',animals:['owl','wolf','whale'],label:'思考力・検証力'},
  {key:'support',name:'共感・調整型',desc:'聞く・つなぐ・場を整える',animals:['rabbit','tanuki'],label:'共感力・調整力'},
  {key:'creative',name:'企画・表現型',desc:'組み合わせる・独自性を出す',animals:['fox','cat'],label:'企画力・表現力'}
];
const TYPE_META={
  lion:{tag:'決断・牽引',one:'決めて、人を前へ動かす'},
  gorilla:{tag:'巻き込み・実行',one:'人を巻き込み、形にする'},
  boar:{tag:'行動・突破',one:'まず動いて、道を開く'},
  owl:{tag:'分析・検証',one:'根拠を集め、筋道を立てる'},
  wolf:{tag:'専門・深掘り',one:'一つを深く掘り、強みにする'},
  whale:{tag:'構想・長期視点',one:'大きな流れと先を見通す'},
  rabbit:{tag:'共感・傾聴',one:'相手の話を拾い、安心をつくる'},
  tanuki:{tag:'調整・橋渡し',one:'違う立場を自然につなぐ'},
  fox:{tag:'企画・組み合わせ',one:'人・情報・発想を組み合わせる'},
  cat:{tag:'感性・独自性',one:'自分らしい世界観を形にする'}
};
const DASH_SCENES={
  lion:{scene:'lion',tag:'🔥 決断と推進が強い群れ',line:'前へ進める人が多い。話が具体化するのが速そうです。'},
  boar:{scene:'boar',tag:'💨 まず試す人が多い群れ',line:'考えて終わらず、やってみる。挑戦が始まりやすい会場です。'},
  rabbit:{scene:'rabbit',tag:'🌿 安心して話せる群れ',line:'人の話を拾う力が強い。初対面でもつながりが生まれやすそうです。'},
  owl:{scene:'owl',tag:'📐 かなり考える群れ',line:'根拠・検証・再現性を大切にする人が多い。議論が深くなりそうです。'},
  fox:{scene:'fox',tag:'🧩 コラボが生まれやすい群れ',line:'人・情報・アイデアを組み合わせる人が多い。企画が化けそうです。'},
  cat:{scene:'cat',tag:'✨ 世界観の濃い群れ',line:'美意識や独自性を大事にする人が多い。空間づくりの話が熱くなりそうです。'},
  wolf:{scene:'wolf',tag:'🌙 専門性を深掘る群れ',line:'一つのテーマを深く掘る人が多い。濃い情報交換になりそうです。'},
  gorilla:{scene:'gorilla',tag:'💪 巻き込み力の強い群れ',line:'人をつなぎながら実行する人が多い。交流会から案件が動きそうです。'},
  whale:{scene:'whale',tag:'🌊 大きな構想を描く群れ',line:'長い時間軸で業界や地域を見る人が多い。話が大きく広がりそうです。'},
  tanuki:{scene:'tanuki',tag:'🍂 調整と接続が上手い群れ',line:'立場の違う人を自然につなぐ人が多い。場そのものが機能しそうです。'}
};
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function countOf(d,keys){return keys.reduce((s,k)=>s+(d.typeCounts[k]||0),0)}
function typeLabel(d,key){return d.types&&d.types[key]?d.types[key].name:key}
function groupData(d){return GROUPS.map(g=>{const value=countOf(d,g.animals);return Object.assign({},g,{value,percent:d.diagnosedTotal?Math.round(value/d.diagnosedTotal*100):0})}).sort((a,b)=>b.value-a.value)}
function ecosystemComment(d){
  if(!d.diagnosedTotal)return{title:'東北エリアの生態系、ただいま観察中。',text:'回答が集まると、4つの傾向と動物タイプから会場全体の強みを読み解きます。'};
  if(d.diagnosedTotal<4)return{title:'まだ少数精鋭。すでに面白い気配があります。',text:'回答が増えると「推進型・分析型・共感調整型・企画表現型」のどこが強い会場か見えてきます。'};
  const groups=groupData(d),top=groups[0],second=groups[1];
  let text='最多は「'+top.name+'」'+top.percent+'%。'+top.desc+'人が多い構成です。';
  if(second&&second.value>0)text+=' 次いで「'+second.name+'」'+second.percent+'%。';
  return{title:'東北エリアは「'+top.label+'」が強めです。',text};
}
function loadDashboard(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>document.getElementById('content').innerHTML='<div class="error">読み込めませんでした。'+esc(e&&e.message?e.message:'')+'</div>').getDashboardData(EVENT_ID)}
function render(d){
  document.getElementById('total').textContent=d.total||0;
  document.getElementById('title').textContent=EVENT_ID.indexOf('sendai-')===0?'東北エリアの生態系':'会場の生態系';
  document.getElementById('eventLabel').textContent=EVENT_ID.indexOf('sendai-')===0?'リノベーション協議会 東北部会｜東北エリア｜2026-10-08':'全イベント';
  document.getElementById('legacy').textContent=d.legacyTotal?'旧バージョン回答 '+d.legacyTotal+'件は動物分布から除外':'';
  const c=ecosystemComment(d);document.getElementById('commentary').innerHTML='<div class="commentary"><div class="commentaryTitle">'+esc(c.title)+'</div><div class="commentaryText">'+esc(c.text)+'</div></div>';
  if(!d.diagnosedTotal){document.getElementById('content').innerHTML='<div class="empty">回答を待っています。</div>';return}
  const all=Object.keys(d.types).map(k=>{const count=d.typeCounts[k]||0;return{key:k,value:count,percent:Math.round(count/d.diagnosedTotal*100),label:d.types[k].name,emoji:d.types[k].emoji}}).sort((a,b)=>b.value-a.value);
  const leader=all[0],scene=DASH_SCENES[leader.key]||{scene:'owl',tag:'今日の生態系',line:'いろいろな強みが混ざっています。'};
  const hero='<div class="ecosystemHero '+scene.scene+'"><div class="ecoEmoji">'+esc(leader.emoji)+'</div><div><div class="ecoKicker">TODAY’S TOHOKU ECOSYSTEM</div><div class="ecoTitle">'+esc(scene.tag)+'</div><div class="ecoText">'+esc(scene.line)+' 最多は「'+esc(leader.label)+'」タイプ。</div></div><div class="ecoStat"><b>'+leader.percent+'%</b><span>'+leader.value+'人 / '+d.diagnosedTotal+'人</span></div></div>';
  const groups='<div class="sectionTitle">会場全体を4つの傾向で見る</div><div class="groupGrid">'+groupData(d).map(groupCard).join('')+'</div>';
  const types='<div class="sectionTitle">動物タイプ別｜一言でいうと</div><div class="typeGrid">'+all.map((x,i)=>typeCard(x,i===0)).join('')+'</div>';
  const roles='<div class="sectionTitle">立場別の傾向</div><div class="roles">'+['reno','maker','sales'].map(k=>roleCard(d.roleBreakdown[k])).join('')+'</div>';
  document.getElementById('content').innerHTML=hero+groups+types+roles;
}
function groupCard(g){return '<div class="groupCard"><div class="groupTop"><div class="groupName">'+esc(g.name)+'</div><div class="groupPct">'+g.percent+'%</div></div><div class="groupDesc">'+esc(g.desc)+'</div><div class="groupAnimals">'+g.animals.map(a=>typeLabel(lastData||{},a)).join('・')+'</div><div class="groupBar"><div class="groupFill" style="width:'+g.percent+'%"></div></div></div>'}
let lastData=null;
const originalRender=render;
render=function(d){lastData=d;originalRender(d)};
function typeCard(x,isLeader){const m=TYPE_META[x.key]||{tag:'個性型',one:'それぞれの強みを持つ'};return '<div class="typeCard'+(isLeader?' leader':'')+'">'+(isLeader?'<span class="crown">👑 最多タイプ</span>':'')+'<div class="emoji">'+esc(x.emoji)+'</div><div class="pct">'+x.percent+'%</div><div class="name">'+esc(x.label)+' <small>'+x.value+'人</small></div><div class="typeTag">'+esc(m.tag)+'</div><div class="typeOne">'+esc(m.one)+'</div><div class="bar"><div class="fill" style="width:'+x.percent+'%"></div></div></div>'}
function roleCard(b){const ranks=b&&b.typeRanking||[];return '<div class="role"><div class="roleTitle">'+esc(b&&b.label?b.label:'未分類')+'<span class="n">'+(b&&b.count?b.count:0)+'人</span></div>'+(ranks.length?ranks.slice(0,5).map(x=>'<div class="rank"><div class="rankEmoji">'+esc(x.emoji)+'</div><div class="rankName">'+esc(x.label)+'</div><div class="rankPct">'+x.percent+'%</div></div>').join(''):'<div class="rankName">回答待ち</div>')+'</div>'}
loadDashboard();
</script>
</body>
</html>
