name: Strict test Preview Release - renovation-ai-seminar-survey

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: strict-production-pipeline
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout seminar source
        uses: actions/checkout@v4
        with:
          repository: Camper-1973/renovation-ai-seminar-survey
          ref: ${{ github.sha }}
          path: seminar

      - name: Capture source SHA
        id: source
        shell: bash
        run: echo "sha=$(git -C seminar rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assemble exact 4-file payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp seminar/appsscript.json deploy/appsscript.json
          cp seminar/Code.gs deploy/Code.gs
          cp seminar/Index.html deploy/Index.html
          cp seminar/Dashboard.html deploy/Dashboard.html
          actual="$(find deploy -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected="$(printf '%s\n' Code.gs Dashboard.html Index.html appsscript.json | sort)"
          test "$actual" = "$expected" || {
            echo 'Unexpected seminar payload'
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          }

      - name: Check exact payload syntax and pure regressions
        run: node seminar/ci/verify.cjs deploy
      - uses: actions/upload-artifact@v4
        with:
          name: validated-payload
          path: deploy
          retention-days: 7
          if-no-files-found: error
  preview:
    outputs:
      version: ${{ steps.verified.outputs.version }}
      payload_hash: ${{ steps.verified.outputs.payload_hash }}
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-payload
          path: deploy

      - name: Configure clasp for production Apps Script
        shell: bash
        env:
          SEMINAR_PROD_SCRIPT_ID: ${{ secrets.SEMINAR_PROD_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SEMINAR_PROD_SCRIPT_ID" > deploy/.clasp.json

      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Push exact source
        working-directory: deploy
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force 2>&1 | tee /tmp/clasp-push.log
          grep -Eq 'Pushed [0-9]+ files|Script is already up to date' /tmp/clasp-push.log

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verification
      - name: Install pinned browser test tools
        run: npm install --prefix verification/ci --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium
        working-directory: verification/ci
        run: npx playwright install --with-deps chromium
      - name: Verify remote payload and authenticated dev access
        id: verified
        run: node verification/ci/live-preview.cjs deploy

  release:
    needs: [test, preview]
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.preview.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-payload
          path: deploy

      - name: Configure clasp for production Apps Script
        shell: bash
        env:
          SEMINAR_PROD_SCRIPT_ID: ${{ secrets.SEMINAR_PROD_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SEMINAR_PROD_SCRIPT_ID" > deploy/.clasp.json

      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verification
      - name: Refresh existing clasp credential
        working-directory: deploy
        run: clasp list-versions > /dev/null

      - name: Update and verify existing deployment at tested immutable version
        env:
          TARGET_DEPLOYMENT_ID: ${{ secrets.SEMINAR_PROD_DEPLOYMENT_ID }}
          VERIFIED_VERSION: ${{ needs.preview.outputs.version }}
          VERIFIED_HASH: ${{ needs.preview.outputs.payload_hash }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node verification/ci/release-version.cjs deploy

  summary:
    if: always()
    needs: [test, preview, release]
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCES: ${{ toJSON(needs.test.outputs) }}
      TEST: ${{ needs.test.result }}
      PREVIEW: ${{ needs.preview.result }}
      RELEASE: ${{ needs.release.result }}
      VERIFIED_VERSION: ${{ needs.preview.outputs.version }}
      PAYLOAD_HASH: ${{ needs.preview.outputs.payload_hash }}
    steps:
      - name: Write deployment summary
        run: |
          {
            echo "## Strict deployment result"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Captured sources: $SOURCES"
            echo "- Test: $TEST"
            echo "- Preview: $PREVIEW"
            echo "- Existing deployment update: $RELEASE"
            echo "- New deployment creation: prohibited"
            echo "- Verified version: $VERIFIED_VERSION"
            echo "- Payload SHA256: $PAYLOAD_HASH"
          } >> "$GITHUB_STEP_SUMMARY"
