name: Strict test Preview Release - renovation-ai-seminar-survey

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: strict-production-pipeline
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout seminar source
        uses: actions/checkout@v4
        with:
          repository: Camper-1973/renovation-ai-seminar-survey
          ref: ${{ github.sha }}
          path: seminar

      - name: Capture source SHA
        id: source
        shell: bash
        run: echo "sha=$(git -C seminar rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assemble exact 4-file payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp seminar/appsscript.json deploy/appsscript.json
          cp seminar/Code.gs deploy/Code.gs
          cp seminar/Index.html deploy/Index.html
          cp seminar/Dashboard.html deploy/Dashboard.html
          actual="$(find deploy -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected="$(printf '%s\n' Code.gs Dashboard.html Index.html appsscript.json | sort)"
          test "$actual" = "$expected" || {
            echo 'Unexpected seminar payload'
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          }

      - name: Check exact payload syntax and pure regressions
        run: node seminar/ci/verify.cjs deploy
      - uses: actions/upload-artifact@v4
        with:
          name: validated-payload
          path: deploy
          retention-days: 7
          if-no-files-found: error
  preview:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-payload
          path: deploy
      - name: Configure clasp for production Apps Script
        shell: bash
        env:
          SEMINAR_PROD_SCRIPT_ID: ${{ secrets.SEMINAR_PROD_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SEMINAR_PROD_SCRIPT_ID" > deploy/.clasp.json

      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Push exact source
        working-directory: deploy
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force 2>&1 | tee /tmp/clasp-push.log
          grep -Eq 'Pushed [0-9]+ files|Script is already up to date' /tmp/clasp-push.log

      - name: Require authenticated dev regression evidence
        run: |
          echo "::error::Release blocked: authenticated /dev behavioral checks for this exact payload are not automated. Source push alone is not Preview success. See CI_RELEASE_SAFETY.md."
          exit 1
  release:
    needs: [test, preview]
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.preview.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-payload
          path: deploy
      - name: Configure clasp for production Apps Script
        shell: bash
        env:
          SEMINAR_PROD_SCRIPT_ID: ${{ secrets.SEMINAR_PROD_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SEMINAR_PROD_SCRIPT_ID" > deploy/.clasp.json

      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Push exact source
        working-directory: deploy
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force 2>&1 | tee /tmp/clasp-push.log
          grep -Eq 'Pushed [0-9]+ files|Script is already up to date' /tmp/clasp-push.log

      - name: Update existing Web App deployment
        working-directory: deploy
        shell: bash
        env:
          SEMINAR_PROD_DEPLOYMENT_ID: ${{ secrets.SEMINAR_PROD_DEPLOYMENT_ID }}
          SOURCE_SHA: ${{ needs.test.outputs.source_sha }}
        run: |
          set -euo pipefail
          clasp update-deployment "$SEMINAR_PROD_DEPLOYMENT_ID" --description "Seminar survey release=$SOURCE_SHA"

  summary:
    if: always()
    needs: [test, preview, release]
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCES: ${{ toJSON(needs.test.outputs) }}
      TEST: ${{ needs.test.result }}
      PREVIEW: ${{ needs.preview.result }}
      RELEASE: ${{ needs.release.result }}
    steps:
      - run: |
          {
            echo "## Strict deployment result"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Captured sources: $SOURCES"
            echo "- Test: $TEST"
            echo "- Preview: $PREVIEW"
            echo "- Existing deployment update: $RELEASE"
            echo "- New deployment creation: prohibited"
            echo "- Release remains blocked until authenticated dev checks are implemented."
          } >> "$GITHUB_STEP_SUMMARY"
