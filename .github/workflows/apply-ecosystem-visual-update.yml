name: Apply ecosystem visual update
on:
  push:
    paths:
      - '.github/workflows/apply-ecosystem-visual-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Enhance result and dashboard visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('Index.html')
          s=p.read_text(encoding='utf-8')
          extra_css=r'''
          /* seminar result reveal */
          .hero{position:relative;isolation:isolate;overflow:hidden;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center}
          .hero>*{position:relative;z-index:3}.hero::before,.hero::after{content:"";position:absolute;inset:-20%;z-index:0;pointer-events:none}
          .animal{font-size:104px;filter:drop-shadow(0 12px 22px #0005);animation:animalReveal .8s cubic-bezier(.2,.9,.25,1.2) both}
          .kicker{font-size:13px;letter-spacing:.22em;opacity:.9;animation:fadeUp .55s .25s both}.hero h2{font-size:38px;letter-spacing:.03em;text-shadow:0 3px 16px #0005;animation:fadeUp .6s .35s both}.copy{max-width:520px;animation:fadeUp .6s .48s both}
          .sceneTag{display:inline-block;margin:3px 0 9px;padding:5px 12px;border:1px solid #ffffff55;border-radius:99px;background:#ffffff18;font-size:11px;font-weight:800;letter-spacing:.08em;backdrop-filter:blur(5px)}
          .heroFx{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}.fx{position:absolute;display:block}
          .hero.scene-lion{background:radial-gradient(circle at 50% 18%,#ffd577 0,#b64a22 37%,#4b1d18 100%)}.scene-lion::before{background:repeating-conic-gradient(from 0deg,#ffd67b22 0 7deg,transparent 7deg 15deg);animation:spinSlow 18s linear infinite}.scene-lion .fx{bottom:-35px;width:52px;height:100px;border-radius:50% 50% 15% 15%;background:linear-gradient(#ffd85b,#ff6d26 52%,#a72519);filter:blur(1px);animation:flame 1.15s ease-in-out infinite alternate}.scene-lion .fx:nth-child(1){left:7%}.scene-lion .fx:nth-child(2){left:28%;animation-delay:-.4s}.scene-lion .fx:nth-child(3){left:53%;animation-delay:-.7s}.scene-lion .fx:nth-child(4){left:78%;animation-delay:-.2s}
          .hero.scene-boar{background:linear-gradient(145deg,#4b2d1c,#9b4f27 55%,#d58a3b)}.scene-boar::before{background:repeating-linear-gradient(115deg,transparent 0 22px,#fff1 23px 27px);animation:speedLines 1.2s linear infinite}.scene-boar .fx{width:120px;height:50px;border-radius:50%;background:#e7c49455;filter:blur(12px);bottom:12%;animation:dust 1.7s ease-out infinite}.scene-boar .fx:nth-child(1){left:5%}.scene-boar .fx:nth-child(2){left:45%;animation-delay:-.8s}.scene-boar .fx:nth-child(3){left:72%;animation-delay:-1.2s}
          .hero.scene-rabbit{background:linear-gradient(160deg,#7ca97d,#c9dfb5 55%,#f1dfbd);color:#23432d}.scene-rabbit::before{background:radial-gradient(circle at 20% 30%,#fff9 0 4px,transparent 5px),radial-gradient(circle at 70% 16%,#fff8 0 6px,transparent 7px),radial-gradient(circle at 82% 64%,#fff7 0 5px,transparent 6px);animation:floatSoft 5s ease-in-out infinite}.scene-rabbit .animal{filter:drop-shadow(0 10px 16px #31552c40)}.scene-rabbit .heroFx{background:linear-gradient(transparent 70%,#4e7b4d55)}.scene-rabbit .fx{width:16px;height:16px;border-radius:50%;background:#fff9;animation:bubble 4s ease-in-out infinite}.scene-rabbit .fx:nth-child(1){left:15%;top:70%}.scene-rabbit .fx:nth-child(2){left:70%;top:66%;animation-delay:-1.5s}.scene-rabbit .fx:nth-child(3){left:86%;top:42%;animation-delay:-2.4s}
          .hero.scene-owl{background:radial-gradient(circle at 50% 30%,#284864,#122334 60%,#08111c)}.scene-owl::before{background-image:linear-gradient(#7dc8e51a 1px,transparent 1px),linear-gradient(90deg,#7dc8e51a 1px,transparent 1px);background-size:28px 28px;transform:perspective(400px) rotateX(55deg) translateY(40%);animation:gridMove 5s linear infinite}.scene-owl::after{background:radial-gradient(circle,#b8e6ff33 0 2px,transparent 3px);background-size:43px 43px;animation:floatSoft 6s ease-in-out infinite}
          .hero.scene-fox{background:linear-gradient(135deg,#582b23,#c96832 52%,#e3aa52)}.scene-fox::before{background:conic-gradient(from 45deg at 20% 30%,transparent,#ffdca422,transparent 20%),conic-gradient(from 210deg at 80% 65%,transparent,#fff3 0 12%,transparent 24%);animation:spinSlow 16s linear infinite}.scene-fox .fx{width:70px;height:70px;border:1px solid #ffe0b877;transform:rotate(45deg);animation:tile 3.2s ease-in-out infinite}.scene-fox .fx:nth-child(1){left:9%;top:30%}.scene-fox .fx:nth-child(2){right:10%;top:18%;animation-delay:-1s}.scene-fox .fx:nth-child(3){right:22%;bottom:6%;animation-delay:-2s}
          .hero.scene-cat{background:linear-gradient(145deg,#2d2737,#69526f 58%,#b28ba8)}.scene-cat::before{background:radial-gradient(circle at 75% 25%,#ffe7ff44,transparent 28%),linear-gradient(120deg,transparent 35%,#fff1 36%,transparent 37%)}.scene-cat .fx{width:90px;height:3px;background:#ffe8fb66;animation:catLine 3s ease-in-out infinite}.scene-cat .fx:nth-child(1){left:8%;top:35%;transform:rotate(18deg)}.scene-cat .fx:nth-child(2){right:5%;top:62%;transform:rotate(-22deg);animation-delay:-1.1s}
          .hero.scene-wolf{background:linear-gradient(155deg,#172431,#39505f 55%,#798b91)}.scene-wolf::before{background:radial-gradient(circle at 70% 20%,#dceaff66 0 11%,transparent 12%),linear-gradient(115deg,transparent 54%,#b9d5e722 55%,transparent 57%)}.scene-wolf .fx{height:1px;width:170px;background:#dcecff66;animation:scan 2.8s ease-in-out infinite}.scene-wolf .fx:nth-child(1){left:4%;top:35%}.scene-wolf .fx:nth-child(2){right:5%;top:64%;animation-delay:-1.3s}
          .hero.scene-gorilla{background:linear-gradient(140deg,#1f3128,#3c6650 55%,#71876a)}.scene-gorilla::before{background:radial-gradient(circle at 15% 80%,#dbe58a22,transparent 23%),radial-gradient(circle at 85% 30%,#87b77a22,transparent 28%);animation:pulseBg 3s ease-in-out infinite}.scene-gorilla .fx{width:70px;height:70px;border-radius:50%;border:4px solid #d6e7b733;animation:impact 2.4s ease-out infinite}.scene-gorilla .fx:nth-child(1){left:10%;bottom:12%}.scene-gorilla .fx:nth-child(2){right:8%;top:17%;animation-delay:-1.1s}
          .hero.scene-whale{background:linear-gradient(#13384f,#256984 58%,#6fa9b7)}.scene-whale::before{background:radial-gradient(ellipse at 20% 90%,#fff2 0 8%,transparent 9%),radial-gradient(ellipse at 70% 72%,#fff2 0 6%,transparent 7%);animation:water 5s ease-in-out infinite}.scene-whale .fx{width:12px;height:12px;border:2px solid #d8f6ff99;border-radius:50%;animation:bubble 4.2s ease-in-out infinite}.scene-whale .fx:nth-child(1){left:20%;top:75%}.scene-whale .fx:nth-child(2){left:65%;top:70%;animation-delay:-1.5s}.scene-whale .fx:nth-child(3){left:82%;top:55%;animation-delay:-2.8s}
          .hero.scene-tanuki{background:linear-gradient(145deg,#3e3225,#766448 55%,#a79572)}.scene-tanuki::before{background:radial-gradient(circle at 20% 35%,#fff1 0 8%,transparent 9%),radial-gradient(circle at 80% 70%,#fff1 0 10%,transparent 11%);animation:floatSoft 5s ease-in-out infinite}.scene-tanuki .fx{width:75px;height:75px;border-radius:50%;border:1px dashed #f6e8c766;animation:spinSlow 9s linear infinite}.scene-tanuki .fx:nth-child(1){left:7%;top:20%}.scene-tanuki .fx:nth-child(2){right:7%;bottom:10%;animation-direction:reverse}
          @keyframes animalReveal{from{opacity:0;transform:scale(.25) rotate(-8deg)}70%{transform:scale(1.15) rotate(2deg)}to{opacity:1;transform:scale(1)}}@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes flame{from{transform:scaleY(.7) rotate(-4deg)}to{transform:scaleY(1.15) rotate(5deg)}}@keyframes spinSlow{to{transform:rotate(360deg)}}@keyframes speedLines{to{transform:translate(45px,-20px)}}@keyframes dust{0%{opacity:0;transform:translateX(40px) scale(.4)}35%{opacity:.8}100%{opacity:0;transform:translateX(-90px) scale(1.5)}}@keyframes floatSoft{50%{transform:translateY(-10px)}}@keyframes bubble{0%{opacity:0;transform:translateY(35px) scale(.6)}35%{opacity:.85}100%{opacity:0;transform:translateY(-90px) scale(1.3)}}@keyframes gridMove{to{background-position:0 28px,28px 0}}@keyframes tile{50%{transform:rotate(75deg) scale(1.2);opacity:.35}}@keyframes catLine{50%{transform:translateX(25px) rotate(18deg);opacity:.2}}@keyframes scan{50%{transform:translateX(70px);opacity:.15}}@keyframes pulseBg{50%{transform:scale(1.12)}}@keyframes impact{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2);opacity:0}}@keyframes water{50%{transform:translateY(-12px)}}
          @media(prefers-reduced-motion:reduce){.hero *,.hero::before,.hero::after,.heroFx .fx{animation:none!important}}
          @media(max-width:520px){.hero{min-height:280px}.animal{font-size:92px}.hero h2{font-size:34px}}
          '''
          s=s.replace('</style>',extra_css+'\n</style>',1)
          themes=r'''const RESULT_THEMES={
            lion:{scene:'lion',tag:'🔥 火をつけて前へ進む',fx:4},
            boar:{scene:'boar',tag:'💨 まず走る。道はあとでできる',fx:3},
            rabbit:{scene:'rabbit',tag:'🌿 場をやわらかく整える',fx:3},
            owl:{scene:'owl',tag:'📐 まず構造を読む',fx:0},
            fox:{scene:'fox',tag:'🧩 組み合わせて企画にする',fx:3},
            cat:{scene:'cat',tag:'✨ 世界観は譲らない',fx:2},
            wolf:{scene:'wolf',tag:'🌙 深く掘って芯をつくる',fx:2},
            gorilla:{scene:'gorilla',tag:'💪 人を巻き込み動かす',fx:2},
            whale:{scene:'whale',tag:'🌊 大きな時間軸で見る',fx:3},
            tanuki:{scene:'tanuki',tag:'🍂 場を読み、うまくつなぐ',fx:2}
          };
          function resultFx(n){return '<div class="heroFx">'+Array.from({length:n||0},()=>'<i class="fx"></i>').join('')+'</div>'}
          '''
          s=s.replace('const MATCH_DETAILS={',themes+'\nconst MATCH_DETAILS={',1)
          new_render=r'''function renderResult(r){
            const t=r.type,h=r.hiddenType,theme=RESULT_THEMES[r.typeKey]||{scene:'lion',tag:'あなたらしい仕事の生態',fx:0};
            const axes=Object.keys(r.axes).map(k=>'<div><div class="axisTop"><span>'+esc(r.axes[k])+'</span><span>'+r.scores[k]+'</span></div><div class="track"><div class="fill" style="width:'+r.scores[k]+'%"></div></div></div>').join('');
            const analysis=t.analysis.map(x=>'<p>・'+esc(x)+'</p>').join('');
            const matches=t.matches.map(x=>{const d=(MATCH_DETAILS[r.typeKey]||{})[x.key]||{};return '<div class="match"><div class="matchTitle"><span>'+esc(x.emoji)+'</span>'+esc(x.name)+'タイプと好相性</div><p class="matchReason">'+esc(d.reason||'お互いの強みを補い合いやすい組み合わせです。')+'</p><p class="matchPrompt"><b>見つけたらこんな話を振ってみよう</b><br>'+esc(d.prompt||'最近面白かった仕事について聞いてみよう。')+'</p></div>'}).join('');
            document.getElementById('app').innerHTML='<div class="result"><div class="hero scene-'+theme.scene+'">'+resultFx(theme.fx)+'<div class="animal">'+esc(t.emoji)+'</div><div class="kicker">あなたは</div><h2>'+esc(t.name)+'タイプ</h2><div class="sceneTag">'+esc(theme.tag)+'</div><div class="copy">'+esc(t.copy)+'</div></div><div class="body"><div class="section analysis"><h3>あなたの入力内容からこう分析しました</h3>'+analysis+'</div><div class="section"><h3>6つの生態スコア</h3><div class="axes">'+axes+'</div></div><div class="section"><h3>隠れタイプ</h3><div class="hidden"><div class="hiddenEmoji">'+esc(h.emoji)+'</div><div><b>'+esc(h.name)+'</b><br>'+esc(h.copy)+'</div></div></div><div class="section"><h3>今日の交流会では</h3><div class="approach">'+esc(t.approach)+'</div></div><div class="section"><h3>相性のいい動物</h3><div class="matches">'+matches+'</div></div><div class="section"><h3>北海道の会社と組むなら</h3><div class="collab">'+esc(t.collaboration)+'</div></div><div class="disclaimer">仕事上の選択傾向を楽しむための診断です。</div></div><div class="screenshot">📸 この画面をスクショして<br>交流会で見せ合ってみてください</div></div>';
            window.scrollTo({top:0,behavior:'smooth'});
          }'''
          s,n=re.subn(r'function renderResult\(r\)\{.*?\}\ndocument\.getElementById\(\'surveyForm\'\)',new_render+"\ndocument.getElementById('surveyForm')",s,flags=re.S)
          if n!=1: raise SystemExit(f'Index renderResult replacement failed: {n}')
          p.write_text(s,encoding='utf-8')

          p=Path('Dashboard.html')
          s=p.read_text(encoding='utf-8')
          dash_css=r'''
          .ecosystemHero{position:relative;overflow:hidden;border-radius:1.2vw;margin-bottom:.9vw;padding:1.05vw 1.2vw;color:#fff;min-height:7.5vw;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1vw;box-shadow:0 .5vw 1.6vw #2b24151f}.ecosystemHero>*{position:relative;z-index:2}.ecosystemHero::before,.ecosystemHero::after{content:"";position:absolute;inset:-30%;pointer-events:none}.ecoEmoji{font-size:5vw;filter:drop-shadow(0 .4vw .7vw #0005);animation:ecoPop .75s cubic-bezier(.2,.9,.25,1.2) both}.ecoKicker{font-size:.78vw;letter-spacing:.15em;opacity:.85}.ecoTitle{font-size:1.65vw;font-weight:950;line-height:1.2}.ecoText{font-size:.85vw;line-height:1.5;margin-top:.25vw;max-width:54vw}.ecoStat{text-align:right}.ecoStat b{display:block;font-size:2.3vw}.ecoStat span{font-size:.75vw}.ecosystemHero.lion{background:radial-gradient(circle at 25% 20%,#ffd66d,#b54822 42%,#4b1c18)}.ecosystemHero.lion::before{background:repeating-conic-gradient(#ffd76c22 0 7deg,transparent 7deg 16deg);animation:ecoSpin 18s linear infinite}.ecosystemHero.boar{background:linear-gradient(135deg,#4b2d1d,#a8572b,#d79342)}.ecosystemHero.boar::before{background:repeating-linear-gradient(115deg,transparent 0 24px,#fff2 25px 29px);animation:ecoSpeed 1.2s linear infinite}.ecosystemHero.rabbit{background:linear-gradient(145deg,#5f8d69,#a6c99a,#d8e4b9);color:#183b28}.ecosystemHero.rabbit::after{background:radial-gradient(circle at 15% 25%,#fff8 0 5px,transparent 6px),radial-gradient(circle at 72% 20%,#fff8 0 7px,transparent 8px),radial-gradient(circle at 85% 75%,#fff7 0 5px,transparent 6px);animation:ecoFloat 5s ease-in-out infinite}.ecosystemHero.owl{background:radial-gradient(circle at 25% 25%,#315c77,#14293a 60%,#08131d)}.ecosystemHero.owl::before{background-image:linear-gradient(#9fdfff20 1px,transparent 1px),linear-gradient(90deg,#9fdfff20 1px,transparent 1px);background-size:30px 30px;transform:perspective(400px) rotateX(55deg);animation:ecoGrid 5s linear infinite}.ecosystemHero.fox{background:linear-gradient(135deg,#633023,#c76832,#e1a24e)}.ecosystemHero.cat{background:linear-gradient(135deg,#30273a,#715a79,#b08ba9)}.ecosystemHero.wolf{background:linear-gradient(145deg,#182733,#465e6b,#83949a)}.ecosystemHero.gorilla{background:linear-gradient(135deg,#21372c,#47705a,#7e9473)}.ecosystemHero.whale{background:linear-gradient(#143b52,#28728f,#79afba)}.ecosystemHero.tanuki{background:linear-gradient(135deg,#443526,#7b694c,#aa9876)}
          .typeCard.leader{transform:translateY(-.2vw);border:2px solid #d18c3d;box-shadow:0 .45vw 1.2vw #5d3c1622}.typeCard.leader .emoji{font-size:2.7vw}.crown{display:block;font-size:.65vw;color:#a66422;font-weight:900;letter-spacing:.08em;margin-bottom:.15vw}
          @keyframes ecoPop{from{opacity:0;transform:scale(.25) rotate(-8deg)}70%{transform:scale(1.15)}to{opacity:1;transform:scale(1)}}@keyframes ecoSpin{to{transform:rotate(360deg)}}@keyframes ecoSpeed{to{transform:translate(50px,-20px)}}@keyframes ecoFloat{50%{transform:translateY(-10px)}}@keyframes ecoGrid{to{background-position:0 30px,30px 0}}
          @media(max-width:800px){.ecosystemHero{border-radius:14px;padding:14px;grid-template-columns:70px 1fr}.ecoEmoji{font-size:54px}.ecoKicker{font-size:10px}.ecoTitle{font-size:22px}.ecoText{font-size:12px;max-width:none}.ecoStat{grid-column:1/3;text-align:left;display:flex;gap:7px;align-items:baseline}.ecoStat b{font-size:24px}.ecoStat span{font-size:11px}.typeCard.leader .emoji{font-size:34px}.crown{font-size:10px}}
          @media(prefers-reduced-motion:reduce){.ecosystemHero::before,.ecosystemHero::after,.ecoEmoji{animation:none!important}}
          '''
          s=s.replace('</style>',dash_css+'\n</style>',1)
          scene_const=r'''const DASH_SCENES={
            lion:{scene:'lion',tag:'🔥 決断と推進が強い群れ',line:'前へ進める人が多い。話が具体化するのが速そうです。'},
            boar:{scene:'boar',tag:'💨 まず試す人が多い群れ',line:'考えて終わらず、やってみる。挑戦が始まりやすい会場です。'},
            rabbit:{scene:'rabbit',tag:'🌿 安心して話せる群れ',line:'人の話を拾う力が強い。初対面でもつながりが生まれやすそうです。'},
            owl:{scene:'owl',tag:'📐 かなり考える群れ',line:'根拠・検証・再現性を大切にする人が多い。議論が深くなりそうです。'},
            fox:{scene:'fox',tag:'🧩 コラボが生まれやすい群れ',line:'人・情報・アイデアを組み合わせる人が多い。企画が化けそうです。'},
            cat:{scene:'cat',tag:'✨ 世界観の濃い群れ',line:'美意識や独自性を大事にする人が多い。空間づくりの話が熱くなりそうです。'},
            wolf:{scene:'wolf',tag:'🌙 専門性を深掘る群れ',line:'一つのテーマを深く掘る人が多い。濃い情報交換になりそうです。'},
            gorilla:{scene:'gorilla',tag:'💪 巻き込み力の強い群れ',line:'人をつなぎながら実行する人が多い。交流会から案件が動きそうです。'},
            whale:{scene:'whale',tag:'🌊 大きな構想を描く群れ',line:'長い時間軸で業界や地域を見る人が多い。話が大きく広がりそうです。'},
            tanuki:{scene:'tanuki',tag:'🍂 調整と接続が上手い群れ',line:'立場の違う人を自然につなぐ人が多い。場そのものが機能しそうです。'}
          };'''
          s=s.replace("const EVENT_ID='<?= eventId ?>';", "const EVENT_ID='<?= eventId ?>';\n"+scene_const,1)
          new_render=r'''function render(d){
            document.getElementById('total').textContent=d.total||0;
            document.getElementById('title').textContent=EVENT_ID.indexOf('sendai-')===0?'東北エリアの生態系':'会場の生態系';
            document.getElementById('eventLabel').textContent=EVENT_ID.indexOf('sendai-')===0?'リノベーション協議会 東北部会｜東北エリア｜2026-10-08':'全イベント';
            document.getElementById('legacy').textContent=d.legacyTotal?'旧バージョン回答 '+d.legacyTotal+'件は動物分布から除外':'';
            const c=ecosystemComment(d);document.getElementById('commentary').innerHTML='<div class="commentary"><div class="commentaryTitle">'+esc(c.title)+'</div><div class="commentaryText">'+esc(c.text)+'</div></div>';
            if(!d.diagnosedTotal){document.getElementById('content').innerHTML='<div class="empty">v0.5.0の回答を待っています。</div>';return}
            const all=Object.keys(d.types).map(k=>{const count=d.typeCounts[k]||0;return{key:k,value:count,percent:Math.round(count/d.diagnosedTotal*100),label:d.types[k].name,emoji:d.types[k].emoji}}).sort((a,b)=>b.value-a.value);
            const leader=all[0],scene=DASH_SCENES[leader.key]||{scene:'owl',tag:'今日の生態系',line:'いろいろな強みが混ざっています。'};
            const hero='<div class="ecosystemHero '+scene.scene+'"><div class="ecoEmoji">'+esc(leader.emoji)+'</div><div><div class="ecoKicker">TODAY’S TOHOKU ECOSYSTEM</div><div class="ecoTitle">'+esc(scene.tag)+'</div><div class="ecoText">'+esc(scene.line)+' 最多は「'+esc(leader.label)+'」タイプ。</div></div><div class="ecoStat"><b>'+leader.percent+'%</b><span>'+leader.value+'人 / '+d.diagnosedTotal+'人</span></div></div>';
            document.getElementById('content').innerHTML=hero+'<div class="typeGrid">'+all.map((x,i)=>typeCard(x,i===0)).join('')+'</div><div class="roles">'+['reno','maker','sales'].map(k=>roleCard(d.roleBreakdown[k])).join('')+'</div>';
          }
          function typeCard(x,isLeader){return '<div class="typeCard'+(isLeader?' leader':'')+'">'+(isLeader?'<span class="crown">👑 最多タイプ</span>':'')+'<div class="emoji">'+esc(x.emoji)+'</div><div class="pct">'+x.percent+'%</div><div class="name">'+esc(x.label)+' <small>'+x.value+'人</small></div><div class="bar"><div class="fill" style="width:'+x.percent+'%"></div></div></div>'}'''
          s,n=re.subn(r'function render\(d\)\{.*?\}\nfunction typeCard\(x\)\{.*?\}\nfunction roleCard',new_render+'\nfunction roleCard',s,flags=re.S)
          if n!=1: raise SystemExit(f'Dashboard render replacement failed: {n}')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Index.html Dashboard.html
          git commit -m 'Enhance ecosystem result and Tohoku dashboard visuals'
          git push
      - name: Remove one-shot workflow
        if: success()
        run: |
          git pull --rebase
          git rm .github/workflows/apply-ecosystem-visual-update.yml
          git commit -m 'Remove one-shot visual update workflow'
          git push
