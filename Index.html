<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f4f1; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif; }
    .wrap { max-width: 720px; margin: auto; padding: 14px 12px 34px; overflow-x: hidden; }
    h1 { font-size: 24px; margin: 0 0 5px; line-height: 1.35; }
    .lead { font-size: 13px; color: #666; line-height: 1.55; margin: 0 0 8px; }
    .event { display: inline-block; margin: 0 0 12px; padding: 5px 9px; border-radius: 999px; background: #e9e9e5; color: #555; font-size: 11px; font-weight: 700; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 13px; padding: 13px; margin-bottom: 9px; min-width: 0; }
    .q { font-weight: 800; font-size: 15px; margin-bottom: 9px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; min-width: 0; }
    .two > * { min-width: 0; }
    input[type="text"] { display: block; width: 100%; max-width: 100%; min-width: 0; height: 42px; border: 1px solid #bbb; border-radius: 8px; padding: 0 10px; font-size: 15px; background: #fff; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .choice { position: relative; min-width: 0; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 44px; border: 1px solid #ccc; border-radius: 8px; background: #fafafa; padding: 7px; font-size: 12px; line-height: 1.25; cursor: pointer; }
    .choice input:checked + span { background: #222; color: #fff; border-color: #222; }
    .submit { width: 100%; height: 52px; border: 0; border-radius: 11px; background: #222; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; }
    .submit:disabled { opacity: .45; cursor: wait; }
    .msg { text-align: center; font-size: 13px; min-height: 20px; margin-top: 8px; color: #8a1f11; }
    .result { background: #fff; border: 1px solid #ddd; border-radius: 16px; padding: 24px 18px; text-align: center; }
    .result .emoji { font-size: 48px; }
    .result h2 { font-size: 27px; margin: 8px 0; }
    .result .copy { font-size: 15px; line-height: 1.65; color: #444; }
    .result .hint { margin: 18px 0 0; background: #f1f1ef; border-radius: 12px; padding: 13px; font-weight: 700; line-height: 1.55; }
    .links { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .links a { padding: 10px 13px; border-radius: 9px; border: 1px solid #bbb; color: #222; text-decoration: none; background: #fff; }
    .version { text-align: center; color: #aaa; font-size: 11px; margin-top: 14px; }
    @media (max-width: 520px) { .two { grid-template-columns: 1fr; } .wrap { padding: 10px 9px 28px; } .card { padding: 11px; } .choice span { font-size: 11px; min-height: 41px; } input[type="text"] { font-size: 14px; padding: 0 8px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
<div class="wrap" id="app">
  <h1>1分｜あなたのリノベ業界タイプ診断</h1>
  <p class="lead">5問で、今日のあなたの「狙い」と仕事スタイルを診断します。最後に会場全体も集計します。</p>
  <? if (eventInfo && eventInfo.label) { ?><div class="event"><?= eventInfo.label ?></div><? } ?>
  <form id="surveyForm">
    <div class="card"><div class="q">会社名・お名前</div><div class="two"><input id="company" type="text" placeholder="会社名" autocomplete="organization" required><input id="name" type="text" placeholder="お名前" autocomplete="name" required></div></div>
    <div class="card"><div class="q">1｜あなたの立場は？</div><div class="choices" id="role"></div></div>
    <div class="card"><div class="q">2｜今日ここに来た、一番近い理由は？</div><div class="choices" id="purpose"></div></div>
    <div class="card"><div class="q">3｜仕事で一番テンションが上がる瞬間は？</div><div class="choices" id="excite"></div></div>
    <div class="card"><div class="q">4｜今、会社として一番伸ばしたいのは？</div><div class="choices" id="growth"></div></div>
    <div class="card"><div class="q">5｜今日この場で、自分が人に提供できるものは？</div><div class="choices" id="offer"></div></div>
    <button type="submit" id="submitButton" class="submit">診断する</button>
    <div id="msg" class="msg" aria-live="polite"></div>
  </form>
  <div class="version">v<?= appVersion ?></div>
</div>

<script>
const EVENT_ID = '<?= eventId ?>';
const ROLES = { reno:'リノベ・施工・設計', maker:'メーカー', sales:'販売・流通' };
const PURPOSE = { deal:'商談・仕事につながる相手を見つけたい', info:'新しい商品・技術・事例を仕入れたい', people:'人脈を広げたい・久しぶりの人に会いたい', trend:'業界の動きや他社の話を聞きたい', fun:'なんとなく面白そうだった', sent:'会社・上司に行ってこいと言われた', none:'特に目的はない。来てから考える' };
const EXCITE = { win:'案件や提案が決まった', discover:'いい商品・技術を見つけた', solve:'難しい問題を解決した', happy:'お客さんに喜ばれた', connect:'新しい人とつながった' };
const GROWTH = { sales:'営業・受注', proposal:'提案力', knowledge:'商品・技術知識', network:'人脈・協業', system:'業務効率・仕組み化' };
const OFFER = { job:'案件・仕事', product:'商品・技術情報', price:'価格・調達力', knowhow:'施工・設計ノウハウ', intro:'人や会社の紹介' };

function buildChoices(id, obj) {
  document.getElementById(id).innerHTML = Object.entries(obj).map(([value, label]) => `<label class="choice"><input type="radio" name="${id}" value="${value}"><span>${label}</span></label>`).join('');
}

buildChoices('role', ROLES);
buildChoices('purpose', PURPOSE);
buildChoices('excite', EXCITE);
buildChoices('growth', GROWTH);
buildChoices('offer', OFFER);

function selectedValue(id) {
  const item = document.querySelector(`#${id} input:checked`);
  return item ? item.value : '';
}

function showError(text) {
  document.getElementById('msg').textContent = text;
}

document.getElementById('surveyForm').addEventListener('submit', event => {
  event.preventDefault();
  const data = {
    eventId: EVENT_ID,
    company: document.getElementById('company').value.trim(),
    name: document.getElementById('name').value.trim(),
    role: selectedValue('role'),
    purpose: selectedValue('purpose'),
    excite: selectedValue('excite'),
    growth: selectedValue('growth'),
    offer: selectedValue('offer')
  };

  if (!data.company || !data.name || !data.role || !data.purpose || !data.excite || !data.growth || !data.offer) {
    showError('すべて回答してください。');
    return;
  }

  const button = document.getElementById('submitButton');
  button.disabled = true;
  button.textContent = '送信中…';
  showError('');

  google.script.run
    .withSuccessHandler(result => {
      const type = result.type;
      const dashboardUrl = '?mode=dashboard&event=' + encodeURIComponent(EVENT_ID);
      document.getElementById('app').innerHTML = `<div class="result"><div class="emoji">${type.emoji}</div><div>あなたは…</div><h2>${type.name}</h2><div class="copy">${type.copy}</div><div class="hint">${type.hint}</div><div class="links"><a href="${dashboardUrl}" target="_blank">この回の集計を見る</a></div></div>`;
    })
    .withFailureHandler(error => {
      button.disabled = false;
      button.textContent = '診断する';
      showError(error && error.message ? error.message : '送信できませんでした。もう一度お試しください。');
    })
    .submitResponse(data);
});
</script>
</body>
</html>
