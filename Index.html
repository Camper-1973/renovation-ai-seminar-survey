.hero.scene-rabbit{background:linear-gradient(160deg,#7ca97d,#c9dfb5 55%,#f1dfbd);color:#23432d}.scene-rabbit::before{background:radial-gradient(circle at 20% 30%,#fff9 0 4px,transparent 5px),radial-gradient(circle at 70% 16%,#fff8 0 6px,transparent 7px),radial-gradient(circle at 82% 64%,#fff7 0 5px,transparent 6px);animation:floatSoft 5s ease-in-out infinite}.scene-rabbit .animal{filter:drop-shadow(0 10px 16px #31552c40)}.scene-rabbit .heroFx{background:linear-gradient(transparent 70%,#4e7b4d55)}.scene-rabbit .fx{width:16px;height:16px;border-radius:50%;background:#fff9;animation:bubble 4s ease-in-out infinite}.scene-rabbit .fx:nth-child(1){left:15%;top:70%}.scene-rabbit .fx:nth-child(2){left:70%;top:66%;animation-delay:-1.5s}.scene-rabbit .fx:nth-child(3){left:86%;top:42%;animation-delay:-2.4s}
.hero.scene-owl{background:radial-gradient(circle at 50% 30%,#284864,#122334 60%,#08111c)}.scene-owl::before{background-image:linear-gradient(#7dc8e51a 1px,transparent 1px),linear-gradient(90deg,#7dc8e51a 1px,transparent 1px);background-size:28px 28px;transform:perspective(400px) rotateX(55deg) translateY(40%);animation:gridMove 5s linear infinite}.scene-owl::after{background:radial-gradient(circle,#b8e6ff33 0 2px,transparent 3px);background-size:43px 43px;animation:floatSoft 6s ease-in-out infinite}
.hero.scene-fox{background:linear-gradient(135deg,#582b23,#c96832 52%,#e3aa52)}.scene-fox::before{background:conic-gradient(from 45deg at 20% 30%,transparent,#ffdca422,transparent 20%),conic-gradient(from 210deg at 80% 65%,transparent,#fff3 0 12%,transparent 24%);animation:spinSlow 16s linear infinite}.scene-fox .fx{width:70px;height:70px;border:1px solid #ffe0b877;transform:rotate(45deg);animation:tile 3.2s ease-in-out infinite}.scene-fox .fx:nth-child(1){left:9%;top:30%}.scene-fox .fx:nth-child(2){right:10%;top:18%;animation-delay:-1s}.scene-fox .fx:nth-child(3){right:22%;bottom:6%;animation-delay:-2s}
.hero.scene-cat{background:linear-gradient(145deg,#2d2737,#69526f 58%,#b28ba8)}.scene-cat::before{background:radial-gradient(circle at 75% 25%,#ffe7ff44,transparent 28%),linear-gradient(120deg,transparent 35%,#fff1 36%,transparent 37%)}.scene-cat .fx{width:90px;height:3px;background:#ffe8fb66;animation:catLine 3s ease-in-out infinite}.scene-cat .fx:nth-child(1){left:8%;top:35%;transform:rotate(18deg)}.scene-cat .fx:nth-child(2){right:5%;top:62%;transform:rotate(-22deg);animation-delay:-1.1s}
.hero.scene-wolf{background:linear-gradient(155deg,#172431,#39505f 55%,#798b91)}.scene-wolf::before{background:radial-gradient(circle at 70% 20%,#dceaff66 0 11%,transparent 12%),linear-gradient(115deg,transparent 54%,#b9d5e722 55%,transparent 57%)}.scene-wolf .fx{height:1px;width:170px;background:#dcecff66;animation:scan 2.8s ease-in-out infinite}.scene-wolf .fx:nth-child(1){left:4%;top:35%}.scene-wolf .fx:nth-child(2){right:5%;top:64%;animation-delay:-1.3s}

.hero.scene-whale{background:linear-gradient(#13384f,#256984 58%,#6fa9b7)}.scene-whale::before{background:radial-gradient(ellipse at 20% 90%,#fff2 0 8%,transparent 9%),radial-gradient(ellipse at 70% 72%,#fff2 0 6%,transparent 7%);animation:water 5s ease-in-out infinite}.scene-whale .fx{width:12px;height:12px;border:2px solid #d8f6ff99;border-radius:50%;animation:bubble 4.2s ease-in-out infinite}.scene-whale .fx:nth-child(1){left:20%;top:75%}.scene-whale .fx:nth-child(2){left:65%;top:70%;animation-delay:-1.5s}.scene-whale .fx:nth-child(3){left:82%;top:55%;animation-delay:-2.8s}
.hero.scene-tanuki{background:linear-gradient(145deg,#3e3225,#766448 55%,#a79572)}.scene-tanuki::before{background:radial-gradient(circle at 20% 35%,#fff1 0 8%,transparent 9%),radial-gradient(circle at 80% 70%,#fff1 0 10%,transparent 11%);animation:floatSoft 5s ease-in-out infinite}.scene-tanuki .fx{width:75px;height:75px;border-radius:50%;border:1px dashed #f6e8c766;animation:spinSlow 9s linear infinite}.scene-tanuki .fx:nth-child(1){left:7%;top:20%}.scene-tanuki .fx:nth-child(2){right:7%;bottom:10%;animation-direction:reverse}
@keyframes animalReveal{from{opacity:0;transform:scale(.25) rotate(-8deg)}70%{transform:scale(1.15) rotate(2deg)}to{opacity:1;transform:scale(1)}}@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes flame{from{transform:scaleY(.7) rotate(-4deg)}to{transform:scaleY(1.15) rotate(5deg)}}@keyframes spinSlow{to{transform:rotate(360deg)}}@keyframes speedLines{to{transform:translate(45px,-20px)}}@keyframes dust{0%{opacity:0;transform:translateX(40px) scale(.4)}35%{opacity:.8}100%{opacity:0;transform:translateX(-90px) scale(1.5)}}@keyframes floatSoft{50%{transform:translateY(-10px)}}@keyframes bubble{0%{opacity:0;transform:translateY(35px) scale(.6)}35%{opacity:.85}100%{opacity:0;transform:translateY(-90px) scale(1.3)}}@keyframes gridMove{to{background-position:0 28px,28px 0}}@keyframes tile{50%{transform:rotate(75deg) scale(1.2);opacity:.35}}@keyframes catLine{50%{transform:translateX(25px) rotate(18deg);opacity:.2}}@keyframes scan{50%{transform:translateX(70px);opacity:.15}}@keyframes pulseBg{50%{transform:scale(1.12)}}@keyframes impact{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2);opacity:0}}@keyframes water{50%{transform:translateY(-12px)}}
@media(prefers-reduced-motion:reduce){.hero *,.hero::before,.hero::after,.heroFx .fx{animation:none!important}}
@media(max-width:520px){.hero{min-height:280px}.animal{font-size:92px}.hero h2{font-size:34px}}

</style></head><body><div class="wrap" id="app"><h1>リノベ業界 生態系診断</h1><p class="lead">仕事での選び方を10問で分析。あなたの動物タイプと、交流会で出会いたい相手がわかります。</p><? if(eventInfo&&eventInfo.label){ ?><div class="event"><?= eventInfo.label ?></div><? } ?><form id="surveyForm"><div class="card"><div class="q">会社名・お名前</div><div class="two"><input id="company" type="text" placeholder="会社名" autocomplete="organization" required><input id="name" type="text" placeholder="お名前" autocomplete="name" required></div></div><div class="card"><div class="q">あなたの立場は？</div><div class="choices" id="role"></div></div><div id="questions"></div><button class="submit" id="submitButton" type="submit">生態系を診断する</button><div class="msg" id="msg" aria-live="polite"></div></form><div class="version">v<?= appVersion ?></div></div>

{q:'お客様が途中で希望を変えたら？',o:{control:'予算・工程を整理する',accept:'できるだけ希望に合わせる',propose:'もっと良い代案を出す',persuade:'変えない方が良いと伝える'}},

{q:'チームでなりやすい役割は？',o:{captain:'方向を決めるリーダー',specialist:'深く調べる専門家',promoter:'人を動かす推進役',supporter:'全体を支える調整役'}},
{q:'自分と違う意見を聞いたら？',o:{debate:'互いの考えを議論する',listen:'まず背景まで聞く',verify:'事実を確かめる',remix:'組み合わせて別案にする'}},
{q:'仕事で一番うれしい瞬間は？',o:{achieve:'目標を達成したとき',solve:'難題を解決したとき',delight:'お客様が喜んだとき',create:'新しい価値を形にしたとき'}}];
const RESULT_THEMES={

const MATCH_DETAILS={
 lion:{owl:{reason:'フクロウは冷静に状況を整理し、先を読んで考えるタイプ。決断と行動が速いライオンに、別角度からの視点を加えてくれます。',prompt:'自分のアイデアに「見落としている点ある？」と聞いてみると面白いかも。'},rabbit:{reason:'ウサギは相手の気持ちや場の空気を丁寧にくみ取るタイプ。前へ進む力の強いライオンを、柔らかく支えてくれます。',prompt:'「この案、相手からはどう見えそう？」と聞いてみると会話が広がりそう。'}},
 wolf:{fox:{reason:'キツネは人・情報・アイデアをつないで企画に変えるタイプ。オオカミの深い専門性を、外へ伝わる形に編集してくれます。',prompt:'自分の専門分野を話して「何と組み合わせたら面白い？」と聞いてみよう。'},rabbit:{reason:'ウサギは小さな声や本音を拾うタイプ。自分の道を深く掘るオオカミに、顧客や仲間の感覚をそっと届けてくれます。',prompt:'「このこだわり、お客さんにはどう伝わると思う？」と意見を聞いてみよう。'}},

 boar:{owl:{reason:'フクロウは立ち止まって検証し、失敗の芽を見つけるタイプ。まず試すイノシシに、ちょうどいいブレーキと判断材料をくれます。',prompt:'試したい案を見せて「最初に潰すならどのリスク？」と聞いてみよう。'},tanuki:{reason:'タヌキは人や状況に合わせて進め方を調整するタイプ。突破力のあるイノシシを、周囲とぶつからず前へ進めてくれます。',prompt:'「これを進めるなら誰から話すのがよさそう？」と相談してみよう。'}},

 owl:{gorilla:{reason:'ゴリラは考えたことを人に会いながら前へ運ぶタイプ。分析を深めるフクロウに、現場からの反応と実行スピードを加えてくれます。',prompt:'考えている案を話して「実際に試すなら誰に会う？」と聞いてみよう。'},lion:{reason:'ライオンは責任を引き受けて方向を決めるタイプ。材料を集めるフクロウに、決断のタイミングと前進力を与えてくれます。',prompt:'迷っているテーマを出して「あなたならどこで決める？」と聞いてみよう。'}},
 fox:{wolf:{reason:'オオカミは一つのテーマを深く掘り、独自の専門性を磨くタイプ。アイデアを編集するキツネに、企画の芯になる深さを与えてくれます。',prompt:'「最近いちばん深掘りしているテーマは？」と聞いて素材を探してみよう。'},cat:{reason:'ネコは自分の美意識と世界観を丁寧に形にするタイプ。組み合わせ上手なキツネに、ぶれない感性の軸を足してくれます。',prompt:'気になる事例を見せて「どこを残すと世界観が立つ？」と聞いてみよう。'}},

function choices(id,obj){document.getElementById(id).innerHTML=Object.entries(obj).map(([v,l])=>'<label class="choice"><input type="radio" name="'+id+'" value="'+v+'"><span>'+l+'</span></label>').join('')}
choices('role',ROLES);document.getElementById('questions').innerHTML=QUESTIONS.map((x,i)=>'<div class="card"><div class="q">'+(i+1)+'｜'+x.q+'</div><div class="choices" id="q'+i+'"></div></div>').join('');QUESTIONS.forEach((x,i)=>choices('q'+i,x.o));
function selected(id){const e=document.querySelector('#'+id+' input:checked');return e?e.value:''}function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function renderResult(r){
  const t=r.type,h=r.hiddenType,theme=RESULT_THEMES[r.typeKey]||{scene:'lion',tag:'あなたらしい仕事の生態',fx:0};
  const axes=Object.keys(r.axes).map(k=>'<div><div class="axisTop"><span>'+esc(r.axes[k])+'</span><span>'+r.scores[k]+'</span></div><div class="track"><div class="fill" style="width:'+r.scores[k]+'%"></div></div></div>').join('');
  const analysis=t.analysis.map(x=>'<p>・'+esc(x)+'</p>').join('');
  const matches=t.matches.map(x=>{const d=(MATCH_DETAILS[r.typeKey]||{})[x.key]||{};return '<div class="match"><div class="matchTitle"><span>'+esc(x.emoji)+'</span>'+esc(x.name)+'タイプと好相性</div><p class="matchReason">'+esc(d.reason||'お互いの強みを補い合いやすい組み合わせです。')+'</p><p class="matchPrompt"><b>見つけたらこんな話を振ってみよう</b><br>'+esc(d.prompt||'最近面白かった仕事について聞いてみよう。')+'</p></div>'}).join('');
  document.getElementById('app').innerHTML='<div class="result"><div class="hero scene-'+theme.scene+'">'+resultFx(theme.fx)+'<div class="animal">'+esc(t.emoji)+'</div><div class="kicker">あなたは</div><h2>'+esc(t.name)+'タイプ</h2><div class="sceneTag">'+esc(theme.tag)+'</div><div class="copy">'+esc(t.copy)+'</div></div><div class="body"><div class="section analysis"><h3>あなたの入力内容からこう分析しました</h3>'+analysis+'</div><div class="section"><h3>6つの生態スコア</h3><div class="axes">'+axes+'</div></div><div class="section"><h3>隠れタイプ</h3><div class="hidden"><div class="hiddenEmoji">'+esc(h.emoji)+'</div><div><b>'+esc(h.name)+'</b><br>'+esc(h.copy)+'</div></div></div><div class="section"><h3>今日の交流会では</h3><div class="approach">'+esc(t.approach)+'</div></div><div class="section"><h3>相性のいい動物</h3><div class="matches">'+matches+'</div></div><div class="section"><h3>北海道の会社と組むなら</h3><div class="collab">'+esc(t.collaboration)+'</div></div><div class="disclaimer">仕事上の選択傾向を楽しむための診断です。</div></div><div class="screenshot">📸 この画面をスクショして<br>交流会で見せ合ってみてください</div></div>';
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('surveyForm').addEventListener('submit',e=>{e.preventDefault();const data={eventId:EVENT_ID,company:document.getElementById('company').value.trim(),name:document.getElementById('name').value.trim(),role:selected('role'),answers:QUESTIONS.map((_,i)=>selected('q'+i))};if(!data.company||!data.name||!data.role||data.answers.some(x=>!x)){document.getElementById('msg').textContent='すべて回答してください。';return}const b=document.getElementById('submitButton');b.disabled=true;b.textContent='分析中…';document.getElementById('msg').textContent='';google.script.run.withSuccessHandler(renderResult).withFailureHandler(err=>{b.disabled=false;b.textContent='生態系を診断する';document.getElementById('msg').textContent=err&&err.message?err.message:'送信できませんでした。'}).submitResponse(data)});
