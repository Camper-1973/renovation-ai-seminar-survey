<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f4f1; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 18px 14px 40px; }
    h1 { margin: 0 0 6px; font-size: 24px; line-height: 1.35; }
    .lead { margin: 0 0 16px; color: #666; font-size: 14px; line-height: 1.6; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 14px; padding: 15px; margin-bottom: 11px; }
    .q { font-weight: 700; font-size: 15px; margin-bottom: 10px; line-height: 1.45; }
    .small { margin-left: 4px; font-weight: 400; color: #777; font-size: 12px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    input[type="text"] { width: 100%; min-height: 46px; border-radius: 9px; border: 1px solid #bbb; padding: 0 12px; font-size: 16px; background: #fff; }
    .choices { display: grid; gap: 7px; }
    .choice { display: block; position: relative; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span { display: flex; align-items: center; min-height: 42px; padding: 9px 11px; border: 1px solid #ccc; border-radius: 9px; background: #fafafa; font-size: 14px; line-height: 1.35; cursor: pointer; }
    .choice input:checked + span { border-color: #222; background: #222; color: #fff; }
    .submit { width: 100%; min-height: 54px; border: 0; border-radius: 12px; background: #222; color: #fff; font-weight: 700; font-size: 17px; cursor: pointer; }
    .submit:disabled { opacity: .45; cursor: wait; }
    .message { min-height: 24px; margin: 10px 2px 0; font-size: 14px; text-align: center; }
    .success { background: #fff; border: 1px solid #ddd; border-radius: 14px; padding: 38px 20px; text-align: center; margin-top: 20px; }
    .success h2 { margin: 0 0 10px; font-size: 23px; }
    .success p { margin: 0; color: #666; line-height: 1.7; }
    .version { text-align: center; color: #aaa; font-size: 11px; margin-top: 16px; }
    @media (max-width: 480px) { .two { grid-template-columns: 1fr; } h1 { font-size: 22px; } .card { padding: 13px; } .choice span { font-size: 13px; } }
  </style>
</head>
<body>
<div class="wrap" id="app">
  <h1>30秒｜リノベ業界 × AI</h1>
  <p class="lead">今日ここにいる皆さんの「仕事の現在地」を教えてください。最後に会場全体の回答を見てみます。</p>

  <form id="surveyForm">
    <div class="card">
      <div class="q">会社名・お名前</div>
      <div class="two">
        <input type="text" id="company" placeholder="会社名" autocomplete="organization" required>
        <input type="text" id="name" placeholder="お名前" autocomplete="name" required>
      </div>
    </div>

    <div class="card">
      <div class="q">1｜普段どの立場で仕事をしていますか？ <span class="small">複数OK</span></div>
      <div class="choices" id="roles"></div>
    </div>

    <div class="card">
      <div class="q">2｜人に依存・属人化していると感じる仕事は？ <span class="small">2つまで</span></div>
      <div class="choices" id="dependent"></div>
    </div>

    <div class="card">
      <div class="q">3｜同じ説明・確認・入力を何度もしている仕事は？ <span class="small">2つまで</span></div>
      <div class="choices" id="repetitive"></div>
    </div>

    <div class="card">
      <div class="q">4｜AIで一つだけ楽にできるなら？ <span class="small">1つ</span></div>
      <div class="choices" id="aiChoice"></div>
    </div>

    <button type="submit" id="submitButton" class="submit">回答する</button>
    <div id="message" class="message" aria-live="polite"></div>
  </form>
  <div class="version">v<?= appVersion ?></div>
</div>

<script>
const ROLES = ['リノベーション事業者・工務店・施工会社','メーカー','建材店・商社・流通','設計・デザイン','その他'];
const CATEGORIES = ['顧客との相談・ヒアリング','見積・価格判断','設計・仕様決定','商品・技術情報を探す','発注・納期確認','工程・現場管理','社内情報・過去案件を探す','問い合わせ対応'];

function buildChoices(containerId, items, type) {
  const container = document.getElementById(containerId);
  items.forEach(item => {
    const label = document.createElement('label');
    label.className = 'choice';
    const input = document.createElement('input');
    input.type = type;
    input.name = containerId;
    input.value = item;
    const span = document.createElement('span');
    span.textContent = item;
    label.appendChild(input);
    label.appendChild(span);
    container.appendChild(label);
  });
}

buildChoices('roles', ROLES, 'checkbox');
buildChoices('dependent', CATEGORIES, 'checkbox');
buildChoices('repetitive', CATEGORIES, 'checkbox');
buildChoices('aiChoice', CATEGORIES, 'radio');

function selected(containerId) {
  return Array.from(document.querySelectorAll('#' + containerId + ' input:checked')).map(input => input.value);
}

function limitCheckboxes(containerId, max) {
  document.getElementById(containerId).addEventListener('change', event => {
    if (!event.target.matches('input[type="checkbox"]')) return;
    const checked = document.querySelectorAll('#' + containerId + ' input:checked');
    if (checked.length > max) event.target.checked = false;
  });
}

limitCheckboxes('dependent', 2);
limitCheckboxes('repetitive', 2);

document.getElementById('surveyForm').addEventListener('submit', event => {
  event.preventDefault();

  const company = document.getElementById('company').value.trim();
  const name = document.getElementById('name').value.trim();
  const roles = selected('roles');
  const dependent = selected('dependent');
  const repetitive = selected('repetitive');
  const ai = document.querySelector('#aiChoice input:checked');
  const message = document.getElementById('message');

  if (!company || !name) return showError('会社名とお名前を入力してください。');
  if (!roles.length) return showError('普段の立場を選んでください。');
  if (!dependent.length) return showError('属人化している仕事を選んでください。');
  if (!repetitive.length) return showError('繰り返している仕事を選んでください。');
  if (!ai) return showError('AIで楽にしたい仕事を選んでください。');

  const button = document.getElementById('submitButton');
  button.disabled = true;
  button.textContent = '送信中…';
  message.textContent = '';

  google.script.run
    .withSuccessHandler(() => {
      document.getElementById('app').innerHTML = '<div class="success"><h2>回答ありがとうございました！</h2><p>このあと会場のみんなの回答を見てみます。</p></div>';
    })
    .withFailureHandler(error => {
      button.disabled = false;
      button.textContent = '回答する';
      showError(error && error.message ? error.message : '送信できませんでした。もう一度お試しください。');
    })
    .submitResponse({ company, name, roles, dependent, repetitive, aiChoice: ai.value });
});

function showError(text) {
  document.getElementById('message').textContent = text;
}
</script>
</body>
</html>
