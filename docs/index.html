<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1分｜リノベ業界タイプ診断</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}.wrap{max-width:720px;margin:auto;padding:14px 12px 34px;overflow-x:hidden}h1{font-size:24px;margin:0 0 5px}.lead{font-size:13px;color:#666;line-height:1.55;margin:0 0 12px}.card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:13px;margin-bottom:9px;min-width:0}.q{font-weight:800;font-size:15px;margin-bottom:9px}.small{font-size:11px;color:#777;font-weight:400}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px;min-width:0}.two>*{min-width:0}input[type=text]{display:block;width:100%;max-width:100%;min-width:0;height:42px;border:1px solid #bbb;border-radius:8px;padding:0 10px;font-size:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{position:relative;min-width:0}.choice input{position:absolute;opacity:0}.choice span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;border:1px solid #ccc;border-radius:8px;background:#fafafa;padding:7px;font-size:12px;line-height:1.25}.choice input:checked+span{background:#222;color:#fff;border-color:#222}.submit{width:100%;height:52px;border:0;border-radius:11px;background:#222;color:#fff;font-size:16px;font-weight:800}.msg{text-align:center;font-size:13px;min-height:20px;margin-top:8px}.result{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px 18px;text-align:center}.result .emoji{font-size:48px}.result h2{font-size:27px;margin:8px 0}.result .copy{font-size:15px;line-height:1.65;color:#444}.result .hint{margin:18px 0 0;background:#f1f1ef;border-radius:12px;padding:13px;font-weight:700;line-height:1.55}.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}.links a{padding:10px 13px;border-radius:9px;border:1px solid #bbb;color:#222;text-decoration:none;background:#fff}@media(max-width:520px){.two{grid-template-columns:1fr}.wrap{padding:10px 9px 28px}.card{padding:11px}.choice span{font-size:11px;min-height:41px}input[type=text]{font-size:14px;padding:0 8px}h1{font-size:21px}}</style></head><body><div class="wrap" id="app"><h1>1分｜あなたのリノベ業界タイプ診断</h1><p class="lead">5問で、今日のあなたの「狙い」と仕事スタイルを診断します。最後に会場全体も集計します。</p><form id="survey"><div class="card"><div class="q">会社名・お名前</div><div class="two"><input id="company" type="text" placeholder="会社名" required><input id="name" type="text" placeholder="お名前" required></div></div><div class="card"><div class="q">1｜あなたの立場は？</div><div class="choices" id="role"></div></div><div class="card"><div class="q">2｜今日ここに来た、一番近い理由は？</div><div class="choices" id="purpose"></div></div><div class="card"><div class="q">3｜仕事で一番テンションが上がる瞬間は？</div><div class="choices" id="excite"></div></div><div class="card"><div class="q">4｜今、会社として一番伸ばしたいのは？</div><div class="choices" id="growth"></div></div><div class="card"><div class="q">5｜今日この場で、自分が人に提供できるものは？</div><div class="choices" id="offer"></div></div><button class="submit">診断する</button><div id="msg" class="msg"></div></form></div><script>
const ROLES={reno:'リノベ・施工・設計',maker:'メーカー',sales:'販売・流通'};
const PURPOSE={deal:'商談・仕事につながる相手を見つけたい',info:'新しい商品・技術・事例を仕入れたい',people:'人脈を広げたい・久しぶりの人に会いたい',trend:'業界の動きや他社の話を聞きたい',fun:'なんとなく面白そうだった',sent:'会社・上司に行ってこいと言われた',none:'特に目的はない。来てから考える'};
const EXCITE={win:'案件や提案が決まった',discover:'いい商品・技術を見つけた',solve:'難しい問題を解決した',happy:'お客さんに喜ばれた',connect:'新しい人とつながった'};
const GROW={sales:'営業・受注',proposal:'提案力',knowledge:'商品・技術知識',network:'人脈・協業',system:'業務効率・仕組み化'};
const OFFER={job:'案件・仕事',product:'商品・技術情報',price:'価格・調達力',knowhow:'施工・設計ノウハウ',intro:'人や会社の紹介'};
const TYPES={hunter:{name:'ゴリゴリ開拓タイプ',emoji:'🔥',copy:'チャンスを見つけたら前へ。商談・受注・次の一手をつくる行動派。',hint:'交流会では「今どんな案件を探してます？」から入ると強い。'},scout:{name:'新商品ハンタータイプ',emoji:'🔍',copy:'新しい商品・技術・事例を集めて、使える形に変える探索派。',hint:'メーカー担当者に「最近いちばん面白い商品は？」と聞いてみよう。'},connector:{name:'つなぐ人タイプ',emoji:'🤝',copy:'人と人、会社と会社をつなぐことで価値をつくるネットワーカー。',hint:'「誰か紹介できそうな人いません？」が今日の魔法の言葉。'},strategist:{name:'現場の軍師タイプ',emoji:'🧠',copy:'情報を整理して、最適な組み合わせや判断をつくる分析・提案派。',hint:'違う立場の人に「その判断、何を基準にしてます？」と聞くと面白い。'},solver:{name:'解決屋タイプ',emoji:'🛠️',copy:'困りごとを見ると放っておけない。現場の詰まりをほどく実務派。',hint:'「最近いちばん困った現場って何でした？」から話すと盛り上がる。'},observer:{name:'様子見スカウトタイプ',emoji:'👀',copy:'最初から決め打ちせず、場を見て面白いものを拾う観察派。',hint:'せっかく来たので、今日は一人だけ「予想外に面白い人」を見つけて帰ろう。'}};
function make(id,obj){document.getElementById(id).innerHTML=Object.entries(obj).map(([v,l])=>`<label class="choice"><input type="radio" name="${id}" value="${v}"><span>${l}</span></label>`).join('')}
make('role',ROLES);make('purpose',PURPOSE);make('excite',EXCITE);make('growth',GROW);make('offer',OFFER);
function val(id){return (document.querySelector(`#${id} input:checked`)||{}).value||''}
function diagnose(d){const s={hunter:0,scout:0,connector:0,strategist:0,solver:0,observer:0};
if(d.purpose==='deal')s.hunter+=3;if(d.purpose==='info'||d.purpose==='trend')s.scout+=2;if(d.purpose==='people')s.connector+=3;if(d.purpose==='sent'||d.purpose==='none'||d.purpose==='fun')s.observer+=3;
if(d.excite==='win')s.hunter+=2;if(d.excite==='discover')s.scout+=3;if(d.excite==='solve')s.solver+=3;if(d.excite==='happy')s.solver+=1,s.strategist+=1;if(d.excite==='connect')s.connector+=3;
if(d.growth==='sales')s.hunter+=2;if(d.growth==='proposal')s.strategist+=3;if(d.growth==='knowledge')s.scout+=2;if(d.growth==='network')s.connector+=2;if(d.growth==='system')s.strategist+=2,s.solver+=1;
if(d.offer==='job')s.hunter+=2;if(d.offer==='product')s.scout+=2;if(d.offer==='price')s.strategist+=2;if(d.offer==='knowhow')s.solver+=2;if(d.offer==='intro')s.connector+=2;
return Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0]}
survey.addEventListener('submit',e=>{e.preventDefault();const d={ts:new Date().toISOString(),company:company.value.trim(),name:name.value.trim(),role:val('role'),purpose:val('purpose'),excite:val('excite'),growth:val('growth'),offer:val('offer')};if(Object.values(d).some((v,i)=>i>0&&!v)){msg.textContent='すべて回答してください。';return}d.type=diagnose(d);const data=JSON.parse(localStorage.getItem('seminarSurveyDemoV3')||'[]');data.push(d);localStorage.setItem('seminarSurveyDemoV3',JSON.stringify(data));const t=TYPES[d.type];app.innerHTML=`<div class="result"><div class="emoji">${t.emoji}</div><div>あなたは…</div><h2>${t.name}</h2><div class="copy">${t.copy}</div><div class="hint">${t.hint}</div><div class="links"><a href="dashboard.html">会場全体を集計する</a><a href="index.html">もう1件試す</a></div></div>`});
</script></body></html>
