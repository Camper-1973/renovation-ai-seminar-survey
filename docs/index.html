<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リノベ業界 生態系診断 v0.5.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f2efe8;color:#24211d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:700px;margin:auto;padding:28px 14px}h1{margin:0 0 8px}.lead{color:#68625b;line-height:1.7}.card{background:#fff;border:1px solid #ded8cc;border-radius:18px;padding:22px;margin:18px 0}.animals{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.animal{text-align:center;background:#f5f2eb;border-radius:12px;padding:10px 4px;font-size:12px;font-weight:700}.animal span{display:block;font-size:32px}.sample{background:linear-gradient(145deg,#294b39,#466d50);color:#fff;text-align:center;border-radius:16px;padding:20px}.sample .emoji{font-size:72px}.sample h2{margin:4px}.note{font-size:12px;color:#777;line-height:1.6}.btn{display:block;text-align:center;background:#2d4938;color:#fff;text-decoration:none;padding:13px;border-radius:11px;font-weight:700}@media(max-width:520px){.animals{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><h1>リノベ業界 生態系診断</h1><p class="lead">10問×6軸から、あなたの仕事スタイルに近い動物と隠れタイプを判定します。</p><section class="card"><div class="animals"><div class="animal"><span>🦁</span>ライオン</div><div class="animal"><span>🐺</span>オオカミ</div><div class="animal"><span>🦍</span>ゴリラ</div><div class="animal"><span>🐗</span>イノシシ</div><div class="animal"><span>🐋</span>クジラ</div><div class="animal"><span>🦉</span>フクロウ</div><div class="animal"><span>🦊</span>キツネ</div><div class="animal"><span>🦝</span>タヌキ</div><div class="animal"><span>🐈</span>ネコ</div><div class="animal"><span>🐇</span>ウサギ</div></div></section><section class="sample"><div class="emoji">🐺</div><div>結果カード例</div><h2>オオカミタイプ</h2><p>独自の視点を磨き、専門性で道を切り開く探究者。</p></section><p class="note">GitHub Pagesは仕様プレビューです。本番の10問診断・回答保存・イベント別集計はGoogle Apps Script版で動作します。</p><a class="btn" href="dashboard.html">会場の生態系プレビュー</a></main></body></html>
