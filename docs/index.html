<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30秒｜今日の本音マップ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:auto;padding:14px 12px 32px}h1{font-size:23px;margin:0 0 5px}.lead{font-size:13px;color:#666;line-height:1.5;margin:0 0 12px}.card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:13px;margin-bottom:9px}.q{font-weight:700;font-size:15px;margin-bottom:9px}.small{font-size:11px;color:#777;font-weight:400}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}input[type=text]{width:100%;height:42px;border:1px solid #bbb;border-radius:8px;padding:0 10px;font-size:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}.roleChoices{grid-template-columns:1fr}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:42px;border:1px solid #ccc;border-radius:8px;background:#fafafa;padding:7px;font-size:12px;line-height:1.25}.roleChoices span{font-size:13px}.choice input:checked+span{background:#222;color:#fff;border-color:#222}.submit{width:100%;height:50px;border:0;border-radius:11px;background:#222;color:#fff;font-size:16px;font-weight:700}.msg{text-align:center;font-size:13px;min-height:20px;margin-top:8px}.success{background:#fff;border:1px solid #ddd;border-radius:14px;padding:32px 18px;text-align:center}.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.links a{padding:10px 13px;border-radius:9px;border:1px solid #bbb;color:#222;text-decoration:none}@media(max-width:360px){.wrap{padding:10px 9px 26px}.card{padding:11px}.choice span{font-size:11px;min-height:40px}.roleChoices span{font-size:12px}.two{gap:5px}input[type=text]{font-size:14px;padding:0 8px}}</style></head><body><div class="wrap" id="app"><h1>30秒｜今日の本音マップ</h1><p class="lead">この会場の「実はこうしたい」を見える化します。最後に3つの立場の本音をみんなで見てみましょう。</p><form id="survey"><div class="card"><div class="q">会社名・お名前</div><div class="two"><input id="company" placeholder="会社名" required><input id="name" placeholder="お名前" required></div></div><div class="card"><div class="q">1｜あなたの立場は？</div><div class="choices roleChoices" id="roles"></div></div><div class="card" id="wishCard" hidden><div class="q" id="wishTitle"></div><div class="choices" id="wishes"></div></div><div class="card"><div class="q">3｜業界でもっとつながると嬉しいのは？ <span class="small">1つ</span></div><div class="choices" id="connection"></div></div><button class="submit">本音を送る</button><div id="msg" class="msg"></div></form></div><script>
const ROLE={reno:'リノベ・施工・設計',maker:'メーカー',sales:'販売・流通'};
const WISH={reno:{title:'2｜今、もっと欲しいものは？ 〈2つまで〉',items:['商品・施工情報','見積・価格情報','メーカーからの提案','協力業者の情報','顧客への提案力','現場・工程の効率化']},maker:{title:'2｜リノベ事業者に、もっとしてほしいことは？ 〈2つまで〉',items:['商品をもっと知ってほしい','お客様へ提案してほしい','もっと相談してほしい','ショールームを活用してほしい','新商品を試してほしい','現場の声を聞かせてほしい']},sales:{title:'2｜リノベ事業者に、もっと知ってほしいことは？ 〈2つまで〉',items:['価格・仕入れの強み','対応の速さ・機動力','取扱商品の幅','商品提案・情報提供','業者・施工店の紹介','新しい商材・サービス']}};
const CON=['商品情報','価格・見積','人・業者','施工ノウハウ','顧客ニーズ','3者の情報連携'];
function make(id,items,type='checkbox'){document.getElementById(id).innerHTML=items.map(([v,l])=>`<label class="choice"><input type="${type}" name="${id}" value="${v}"><span>${l}</span></label>`).join('')}
make('roles',Object.entries(ROLE),'radio');make('connection',CON.map(x=>[x,x]),'radio');
roles.addEventListener('change',e=>{const k=e.target.value,c=WISH[k];wishTitle.textContent=c.title;make('wishes',c.items.map(x=>[x,x]));wishCard.hidden=false;wishes.addEventListener('change',ev=>{const checked=[...wishes.querySelectorAll('input:checked')];if(checked.length>2)ev.target.checked=false},{once:false})});
function one(sel){return (document.querySelector(sel)||{}).value||''}function many(id){return [...document.querySelectorAll(`#${id} input:checked`)].map(x=>x.value)}
survey.addEventListener('submit',e=>{e.preventDefault();const d={ts:new Date().toISOString(),company:company.value.trim(),name:name.value.trim(),role:one('#roles input:checked'),wishes:many('wishes'),connection:one('#connection input:checked')};if(!d.company||!d.name||!d.role||!d.wishes.length||!d.connection){msg.textContent='すべて回答してください。';return}const data=JSON.parse(localStorage.getItem('seminarSurveyDemoV2')||'[]');data.push(d);localStorage.setItem('seminarSurveyDemoV2',JSON.stringify(data));app.innerHTML=`<div class="success"><h2>本音、受け取りました！</h2><p>このあと会場全体の「3者の本音」を見てみましょう。</p><div class="links"><a href="dashboard.html">集計を見る</a><a href="index.html">もう1件試す</a></div></div>`});
</script></body></html>
