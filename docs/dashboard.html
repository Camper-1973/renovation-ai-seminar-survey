<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会場診断｜リノベ業界タイプ</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f3f0;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}.stage{width:min(100vw,177.78vh);min-height:min(56.25vw,100vh);margin:auto;padding:2vw 2.4vw}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.1vw}.eyebrow{font-size:.9vw;color:#777}.title{font-size:2.25vw;font-weight:850;margin-top:.2vw}.count{font-size:3.1vw;font-weight:850}.count small{font-size:.9vw;color:#777;font-weight:500}.typeGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:.65vw;margin-bottom:1vw}.type{background:#fff;border:1px solid #ddd;border-radius:.8vw;padding:.8vw;text-align:center}.emoji{font-size:2vw}.typeName{font-size:.82vw;font-weight:800;line-height:1.2;min-height:2vw}.typePct{font-size:1.75vw;font-weight:900;margin-top:.25vw}.roleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9vw}.card{background:white;border:1px solid #ddd;border-radius:.9vw;padding:1vw;min-height:16.5vw}.role{font-size:1.15vw;font-weight:850;padding-bottom:.55vw;border-bottom:1px solid #ddd}.n{font-size:.72vw;color:#888;margin-left:.3vw;font-weight:500}.section{font-size:.72vw;color:#777;margin:.65vw 0 .35vw;font-weight:700}.item{margin:.48vw 0}.line{display:flex;justify-content:space-between;gap:.45vw;font-size:.82vw;font-weight:650;line-height:1.15}.pct{font-size:1.02vw;font-weight:850}.bar{height:.36vw;background:#eee;border-radius:99px;overflow:hidden;margin-top:.18vw}.fill{height:100%;background:#222}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:.85vw}.message{font-size:1vw;font-weight:750}.btns{display:flex;gap:.4vw}.btn{border:1px solid #bbb;background:#fff;border-radius:.5vw;padding:.42vw .65vw;font-size:.72vw;color:#222;text-decoration:none;cursor:pointer}.empty{text-align:center;padding:9vw 2vw;color:#777;font-size:1.4vw}@media(max-width:800px){.stage{width:100%;padding:14px}.title{font-size:27px}.eyebrow{font-size:12px}.count{font-size:38px}.count small{font-size:12px}.typeGrid{grid-template-columns:repeat(2,1fr);gap:8px}.type{padding:12px}.emoji{font-size:30px}.typeName{font-size:13px;min-height:0}.typePct{font-size:24px}.roleGrid{grid-template-columns:1fr;gap:9px}.card{padding:14px;min-height:0}.role{font-size:18px}.section{font-size:12px}.line{font-size:13px}.pct{font-size:17px}.bar{height:6px}.footer{display:block}.message{font-size:14px;margin-bottom:10px}.btn{font-size:12px;padding:7px 9px}}</style></head><body><div class="stage"><div class="top"><div><div class="eyebrow">1分診断で見えた、今日この会場のキャラクター</div><div class="title">この会場、どんな人たちが集まってる？</div></div><div class="count"><span id="total">0</span><small> 回答</small></div></div><div id="content"></div><div class="footer"><div class="message">本音が見えたところで、この後の交流会で“自分と違うタイプ”にもぜひ話しかけてみましょう。</div><div class="btns"><a class="btn" href="index.html">フォーム</a><button class="btn" onclick="seed()">サンプル</button><button class="btn" onclick="render()">最新表示</button><button class="btn" onclick="clearData()">消去</button></div></div></div><script>
const ROLE={reno:'リノベ・施工・設計',maker:'メーカー',sales:'販売・流通'};
const PURPOSE={deal:'商談・仕事',info:'商品・技術・事例',people:'人脈・再会',trend:'業界動向・他社事例',fun:'なんとなく面白そう',sent:'会社に言われて参加',none:'特に目的なし'};
const TYPES={hunter:['🔥','ゴリゴリ開拓'],scout:['🔍','新商品ハンター'],connector:['🤝','つなぐ人'],strategist:['🧠','現場の軍師'],solver:['🛠️','解決屋'],observer:['👀','様子見スカウト']};
function data(){return JSON.parse(localStorage.getItem('seminarSurveyDemoV3')||'[]')}
function pct(v,n){return n?Math.round(v/n*100):0}
function countBy(rows,key,map){const c={};rows.forEach(r=>{const v=r[key];if(v)c[v]=(c[v]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[map?.[k]||k,v])}
function mini(items,n,limit=3){return items.slice(0,limit).map(([x,v])=>`<div class="item"><div class="line"><span>${x}</span><span class="pct">${pct(v,n)}%</span></div><div class="bar"><div class="fill" style="width:${pct(v,n)}%"></div></div></div>`).join('')}
function roleCard(k,rows){const n=rows.length;const purpose=countBy(rows,'purpose',PURPOSE);const type=countBy(rows,'type',Object.fromEntries(Object.entries(TYPES).map(([k,v])=>[k,v[1]])));return `<div class="card"><div class="role">${ROLE[k]}<span class="n">${n}人</span></div>${n?`<div class="section">今日ここに来た理由</div>${mini(purpose,n)}<div class="section">この立場に多いタイプ</div>${mini(type,n,2)}`:'<div class="empty">回答待ち</div>'}</div>`}
function render(){const d=data();total.textContent=d.length;if(!d.length){content.innerHTML='<div class="empty">まだ回答がありません。「サンプル」で集計イメージを確認できます。</div>';return}const typeCounts={};Object.keys(TYPES).forEach(k=>typeCounts[k]=0);d.forEach(r=>{if(typeCounts[r.type]!=null)typeCounts[r.type]++});const groups={reno:[],maker:[],sales:[]};d.forEach(r=>groups[r.role]?.push(r));content.innerHTML=`<div class="typeGrid">${Object.entries(TYPES).map(([k,v])=>`<div class="type"><div class="emoji">${v[0]}</div><div class="typeName">${v[1]}</div><div class="typePct">${pct(typeCounts[k],d.length)}%</div></div>`).join('')}</div><div class="roleGrid">${roleCard('reno',groups.reno)}${roleCard('maker',groups.maker)}${roleCard('sales',groups.sales)}</div>`}
function diagnose(seed){const s={hunter:0,scout:0,connector:0,strategist:0,solver:0,observer:0},d=seed;if(d.purpose==='deal')s.hunter+=3;if(d.purpose==='info'||d.purpose==='trend')s.scout+=2;if(d.purpose==='people')s.connector+=3;if(['sent','none','fun'].includes(d.purpose))s.observer+=3;if(d.excite==='win')s.hunter+=2;if(d.excite==='discover')s.scout+=3;if(d.excite==='solve')s.solver+=3;if(d.excite==='happy')s.solver+=1,s.strategist+=1;if(d.excite==='connect')s.connector+=3;if(d.growth==='sales')s.hunter+=2;if(d.growth==='proposal')s.strategist+=3;if(d.growth==='knowledge')s.scout+=2;if(d.growth==='network')s.connector+=2;if(d.growth==='system')s.strategist+=2,s.solver+=1;if(d.offer==='job')s.hunter+=2;if(d.offer==='product')s.scout+=2;if(d.offer==='price')s.strategist+=2;if(d.offer==='knowhow')s.solver+=2;if(d.offer==='intro')s.connector+=2;return Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0]}
function seed(){const presets=[['reno','deal','win','sales','job'],['reno','info','discover','knowledge','knowhow'],['reno','trend','solve','system','knowhow'],['reno','people','connect','network','intro'],['reno','sent','happy','proposal','price'],['maker','deal','win','sales','product'],['maker','info','discover','knowledge','product'],['maker','people','connect','network','intro'],['maker','trend','happy','proposal','product'],['sales','deal','win','sales','price'],['sales','people','connect','network','intro'],['sales','info','discover','knowledge','product'],['sales','sent','solve','system','knowhow']];const s=[];for(let i=0;i<32;i++){const p=presets[i%presets.length];const d={company:'デモ',name:'回答者',role:p[0],purpose:p[1],excite:p[2],growth:p[3],offer:p[4]};d.type=diagnose(d);s.push(d)}localStorage.setItem('seminarSurveyDemoV3',JSON.stringify(s));render()}function clearData(){localStorage.removeItem('seminarSurveyDemoV3');render()}render();
</script></body></html>
