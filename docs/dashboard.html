<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>集計デモ｜リノベ業界 × AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}h1{margin:0;font-size:30px}.sub{color:#666;font-size:14px;margin-top:6px}.count{font-size:46px;font-weight:800}.count small{font-size:16px;color:#777;font-weight:500}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.btn{border:1px solid #bbb;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.hero{background:#222;color:white;border-radius:14px;padding:22px;margin-bottom:16px}.hero small{opacity:.7}.hero strong{display:block;font-size:28px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.card h2{font-size:17px;margin:0 0 12px}.rank{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;margin:9px 0}.num{width:26px;height:26px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:700}.val{font-size:22px;font-weight:800}.matrix{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}.row{display:grid;grid-template-columns:minmax(180px,1.8fr) 1fr 1fr 1fr;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eee}.row.head{font-weight:700;color:#666;border-top:0}.cell{text-align:center;background:#f1f1ef;border-radius:7px;padding:7px;font-weight:700}.empty{text-align:center;padding:60px 20px;color:#777}.note{font-size:12px;color:#888;margin-top:12px}.back{color:#222;text-decoration:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1.7fr .7fr .7fr .7fr}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h1>今日の会場｜リノベ業界 × AI</h1><div class="sub">GitHub Pages用デモ集計</div></div><div class="count"><span id="total">0</span> <small>回答</small></div></div>
  <div class="toolbar"><a class="btn back" href="index.html">← フォームへ</a><button class="btn" onclick="seed()">サンプル回答を入れる</button><button class="btn" onclick="clearData()">デモ回答を消す</button></div>
  <div id="content"></div><div class="note">※このデモはlocalStorageを使うため、同じブラウザ・同じ端末で入力した回答だけを集計します。本番GAS版はGoogleスプレッドシートを集計します。</div>
</div>
<script>
const CATS=['顧客との相談・ヒアリング','見積・価格判断','設計・仕様決定','商品・技術情報を探す','発注・納期確認','工程・現場管理','社内情報・過去案件を探す','問い合わせ対応'];
function getData(){return JSON.parse(localStorage.getItem('seminarSurveyDemo')||'[]')}
function counter(){return Object.fromEntries(CATS.map(x=>[x,0]))}
function top(o){return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,3)}
function rank(title,items){return `<div class="card"><h2>${title}</h2>${items.map((x,i)=>`<div class="rank"><div class="num">${i+1}</div><div>${x[0]}</div><div class="val">${x[1]}</div></div>`).join('')}</div>`}
function render(){const data=getData();total.textContent=data.length;if(!data.length){content.innerHTML='<div class="empty">まだ回答がありません。<br>「サンプル回答を入れる」を押すと集計イメージを確認できます。</div>';return}const dep=counter(),rep=counter(),ai=counter();data.forEach(r=>{(r.dependent||[]).forEach(x=>dep[x]++);(r.repetitive||[]).forEach(x=>rep[x]++);if(ai[r.aiChoice]!=null)ai[r.aiChoice]++});const overlap=CATS.map(c=>({c,d:dep[c],r:rep[c],a:ai[c],s:dep[c]+rep[c]+ai[c]})).sort((x,y)=>y.s-x.s);content.innerHTML=`<div class="hero"><small>今日もっとも回答が集中しているテーマ</small><strong>${overlap[0].c}</strong><div>属人化 ${overlap[0].d}　繰り返し ${overlap[0].r}　AIへの期待 ${overlap[0].a}</div></div><div class="grid">${rank('人に依存している仕事',top(dep))}${rank('何度も繰り返している仕事',top(rep))}${rank('AIで楽にしたい仕事',top(ai))}</div><div class="matrix"><h2>属人化 × 繰り返し × AIへの期待</h2><div class="row head"><div>仕事</div><div>属人化</div><div>繰り返し</div><div>AI期待</div></div>${overlap.map((x,i)=>`<div class="row"><div>${i+1}. ${x.c}</div><div class="cell">${x.d}</div><div class="cell">${x.r}</div><div class="cell">${x.a}</div></div>`).join('')}</div>`}
function seed(){const sample=[
{company:'A工務店',name:'田中',roles:['リノベーション事業者・工務店・施工会社'],dependent:['見積・価格判断','工程・現場管理'],repetitive:['見積・価格判断','発注・納期確認'],aiChoice:'見積・価格判断'},
{company:'Bメーカー',name:'佐藤',roles:['メーカー'],dependent:['商品・技術情報を探す','問い合わせ対応'],repetitive:['商品・技術情報を探す','問い合わせ対応'],aiChoice:'商品・技術情報を探す'},
{company:'C商社',name:'鈴木',roles:['建材店・商社・流通'],dependent:['発注・納期確認','商品・技術情報を探す'],repetitive:['発注・納期確認','問い合わせ対応'],aiChoice:'発注・納期確認'},
{company:'Dリノベ',name:'高橋',roles:['リノベーション事業者・工務店・施工会社','設計・デザイン'],dependent:['社内情報・過去案件を探す','見積・価格判断'],repetitive:['社内情報・過去案件を探す','顧客との相談・ヒアリング'],aiChoice:'社内情報・過去案件を探す'},
{company:'E工務店',name:'伊藤',roles:['リノベーション事業者・工務店・施工会社'],dependent:['工程・現場管理','社内情報・過去案件を探す'],repetitive:['工程・現場管理','発注・納期確認'],aiChoice:'工程・現場管理'}];localStorage.setItem('seminarSurveyDemo',JSON.stringify(sample));render()}
function clearData(){localStorage.removeItem('seminarSurveyDemo');render()}render();
</script>
</body>
</html>
