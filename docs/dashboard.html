<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日の会場｜3者の本音</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f3f0;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}.stage{width:min(100vw,177.78vh);min-height:min(56.25vw,100vh);margin:auto;padding:2.3vw 2.7vw}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.4vw}.eyebrow{font-size:1vw;color:#777}.title{font-size:2.5vw;font-weight:800;margin-top:.25vw}.count{font-size:3.5vw;font-weight:800}.count small{font-size:1vw;color:#777;font-weight:500}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.15vw}.card{background:white;border:1px solid #ddd;border-radius:1vw;padding:1.25vw;min-height:23vw}.role{font-size:1.35vw;font-weight:800;padding-bottom:.8vw;border-bottom:1px solid #ddd}.n{font-size:.8vw;color:#888;margin-left:.4vw;font-weight:500}.rank{margin-top:1vw}.item{margin:.75vw 0}.line{display:flex;justify-content:space-between;gap:.6vw;font-size:1vw;font-weight:650}.pct{font-size:1.3vw;font-weight:850}.bar{height:.48vw;background:#eee;border-radius:99px;overflow:hidden;margin-top:.25vw}.fill{height:100%;background:#222;border-radius:99px}.connect{margin-top:1.1vw;background:#222;color:#fff;border-radius:1vw;padding:1vw 1.3vw;display:flex;align-items:center;gap:1.5vw}.connect strong{font-size:1.15vw;white-space:nowrap}.chips{display:flex;gap:.55vw;flex-wrap:wrap}.chip{background:#fff;color:#222;border-radius:99px;padding:.42vw .7vw;font-size:.82vw;font-weight:700}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:.9vw}.message{font-size:1.05vw;font-weight:700}.btns{display:flex;gap:.45vw}.btn{border:1px solid #bbb;background:#fff;border-radius:.55vw;padding:.45vw .7vw;font-size:.75vw;color:#222;text-decoration:none;cursor:pointer}.empty{text-align:center;padding:10vw 2vw;color:#777;font-size:1.5vw}@media(max-width:800px){.stage{width:100%;padding:16px}.title{font-size:28px}.eyebrow{font-size:12px}.count{font-size:38px}.count small{font-size:12px}.grid{grid-template-columns:1fr;gap:10px}.card{padding:15px;min-height:0}.role{font-size:18px}.line{font-size:14px}.pct{font-size:18px}.bar{height:6px}.connect{padding:13px;display:block}.connect strong{font-size:15px}.chips{margin-top:9px}.chip{font-size:12px;padding:6px 9px}.footer{display:block}.message{font-size:14px;margin-bottom:10px}.btn{font-size:12px;padding:7px 9px}}</style></head><body><div class="stage"><div class="top"><div><div class="eyebrow">30秒で見えた、今日この会場のリアル</div><div class="title">リノベ業界｜3者の本音が見えちゃいました。</div></div><div class="count"><span id="total">0</span><small> 回答</small></div></div><div id="content"></div><div class="footer"><div class="message">この本音が見えたところで、この後の交流会でぜひ話しかけてみましょう。</div><div class="btns"><a class="btn" href="index.html">フォーム</a><button class="btn" onclick="seed()">サンプル</button><button class="btn" onclick="render()">最新表示</button><button class="btn" onclick="clearData()">消去</button></div></div></div><script>
const ROLE={reno:'リノベ・施工・設計',maker:'メーカー',sales:'販売・流通'};
function data(){return JSON.parse(localStorage.getItem('seminarSurveyDemoV2')||'[]')}
function topFor(rows){const c={};rows.forEach(r=>(r.wishes||[]).forEach(x=>c[x]=(c[x]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4)}
function card(k,rows){const top=topFor(rows),n=rows.length;return `<div class="card"><div class="role">${ROLE[k]}<span class="n">${n}人</span></div><div class="rank">${top.length?top.map(([x,v])=>{const p=Math.round(v/n*100);return `<div class="item"><div class="line"><span>${x}</span><span class="pct">${p}%</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`}).join(''):'<div class="empty">回答待ち</div>'}</div></div>`}
function render(){const d=data();total.textContent=d.length;if(!d.length){content.innerHTML='<div class="empty">まだ回答がありません。「サンプル」で会場表示のイメージを確認できます。</div>';return}const groups={reno:[],maker:[],sales:[]};d.forEach(r=>groups[r.role]?.push(r));const cc={};d.forEach(r=>cc[r.connection]=(cc[r.connection]||0)+1);const common=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,4);content.innerHTML=`<div class="grid">${card('reno',groups.reno)}${card('maker',groups.maker)}${card('sales',groups.sales)}</div><div class="connect"><strong>みんなが、もっとつながってほしいもの</strong><div class="chips">${common.map(([x,v])=>`<span class="chip">${x} ${Math.round(v/d.length*100)}%</span>`).join('')}</div></div>`}
function seed(){const s=[];function add(role,w,c,n){for(let i=0;i<n;i++)s.push({company:'デモ',name:'回答者',role,wishes:w,connection:c})}add('reno',['商品・施工情報','メーカーからの提案'],'商品情報',5);add('reno',['協力業者の情報','見積・価格情報'],'人・業者',4);add('reno',['商品・施工情報','顧客への提案力'],'施工ノウハウ',3);add('maker',['商品をもっと知ってほしい','お客様へ提案してほしい'],'顧客ニーズ',4);add('maker',['お客様へ提案してほしい','もっと相談してほしい'],'商品情報',3);add('maker',['現場の声を聞かせてほしい','もっと相談してほしい'],'3者の情報連携',2);add('sales',['取扱商品の幅','商品提案・情報提供'],'商品情報',4);add('sales',['対応の速さ・機動力','業者・施工店の紹介'],'人・業者',3);add('sales',['新しい商材・サービス','商品提案・情報提供'],'3者の情報連携',2);localStorage.setItem('seminarSurveyDemoV2',JSON.stringify(s));render()}function clearData(){localStorage.removeItem('seminarSurveyDemoV2');render()}render();
</script></body></html>
